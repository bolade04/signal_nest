# Trivy configuration for the negative-control lock ONLY. The control file is deliberately
# NOT named like a dependency manifest, so GitHub's dependency graph never indexes it and no
# Dependabot alert is raised for a fixture; this binds Trivy's pip analyser to it by name.
scan:
  file-patterns:
    - "pip:pinned-vulnerable\\.txt"
# Pin the ignore file to the tracked, empty security/empty-ignorefile (P6-CI-6 closure): no ignore file in the
# working directory is ever read.
ignorefile: security/empty-ignorefile
