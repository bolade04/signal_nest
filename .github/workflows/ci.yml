      # principal's policy, not asserted as a constant in a JSON file.
      - name: Boundary rollout ownership
        id: rollout
        if: always()
        run: python3 scripts/gen_boundary_rollout.py --check

      # GATE 4N-I16 DEFECT 4. The candidate under test is named EXPLICITLY. CI declares the
