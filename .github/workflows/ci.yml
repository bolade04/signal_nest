        if: always()
        run: |
          # GATE 4N-I19, ADV-A. Issuance and expiry travel TOGETHER. A free-floating expiry is
          # what let Gate 4N-I17 ship a window nothing bounded; both halves now come from the
          # single reviewed pair in scripts/expiry_authorization.py, and generation refuses any
          # window outside the 24-hour authorized maximum.
          python3 scripts/expiry_authorization.py
          python3 scripts/gen_readonly_verifier_policy.py \
            --issuance 2026-08-14T12:00:00Z --expiry 2026-08-15T10:00:00Z

      - name: Independent ReadOnlyVerifier ceiling (decisive, not the self-derived Deny)
        id: verifier_ceiling
