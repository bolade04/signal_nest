      # were unreachable. It now reads the GENERATED side back out of the emitted policy and
      # runs here, so a divergence between the Terraform declarations and the policy actually
      # granted fails the job.
      # GATE 4N-I23, BLOCKER 2. The expected side now comes from the INDEPENDENTLY AUTHORED
      # requirement (tests/fixtures/expected-writable-roles.json), not from
      # role_arns(writable_roles()) — which was the same expression the generated side was
      # read back from. Poisoning writable_roles() to call migration-task writable now moves
      # only the generated side and surfaces as OVER_GRANTED.
      - name: Terraform role inventory reconciliation (authored requirement vs emitted policy)
        id: role_inventory
        if: always()
        run: python3 scripts/terraform_role_inventory.py

      # GATE 4N-I23, closing I22 finding F1. protected_inventory.repository_is_clean() was
      # called only from its own main(), and neither script appeared in this workflow at all —
      # so the SEC-1 containment invariant had no executed consumer. protected_inventory.py:60
      # states the requirement itself: "the containment is only real if re-adding the file is
