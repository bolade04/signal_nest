        # branch returned {"problems": [], "fresh": True} — literals — so the graded step
        # exited 0 for every repository state. The mode is now NAMED, the default verifies
        # too, and tests assert this exact invocation.
        run: python3 scripts/evidence_binding.py --selftest

      - name: Independent package completeness
        id: package_requirements
        if: always()
        run: python3 scripts/package_requirements.py

      - name: Predicted commit package coherence
        id: package_coherence
        if: always()
        run: python3 scripts/commit_package_coherence.py

      # GATE 4N-I23, BLOCKER 3. I22 finding F2: the two-lineage guard was a hand-written list
      # of six ids while seven rows needed it, and the omitted row was secrets_cmk_key_id —
      # the row the mechanism exists for. Coverage is now discovered and accounted in both
      # directions, and provenance.py's exit code depends on it.
      - name: Provenance row coverage (complete, discovered)
        id: provenance_coverage
        if: always()
        run: python3 scripts/provenance.py

      # GATE 4N-I20, ARCH-H3/AWS-3. Records HEAD, the index, the working tree and the PREDICTED
      # COMMIT TREE as separate bindings, so a manifest can never again call a staged file
      # committed.
      - name: Authoritative git state and predicted commit tree
        id: tracked_state
        if: always()
        run: python3 scripts/tracked_state.py

      # Certification is a CONSUMER, not metadata: a local run is candidate-validated and the
      # production gate refuses anything that is not PRODUCTION_CERTIFIED.
      - name: Production-certification state (local runs are never certified)
        id: certification
        if: always()
        run: python3 scripts/production_certification.py state

      # GATE 4N-I20B. Gate 4N-I20A proved the previous CI step could not have caught a
      # regression in the real production entry point: it ran the module's default mode, which
      # reports the local state and exits 0, and never reached the artifact-validating gate. A
      # fabricated artifact — invented candidate, invented HEAD, invented commit tree, empty
      # check list — was PERMITTED with exit 0.
      #
      # This step exercises the REAL `verify` path with mandatory bindings, in a non-production
      # test mode using protected-EQUIVALENT synthetic fixtures. It asserts BOTH directions:
      # the exploit must be refused and a legitimately generated artifact must be permitted.
      # It certifies nothing — the fixtures are synthetic and the run is CI-equivalent only.
      - name: Production gate — real artifact validation (exploit refused, valid permitted)
        id: certification_gate
        if: always()
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import hashlib, json, subprocess, sys, pathlib
          sys.path.insert(0, "scripts")
          import production_certification as pc

          work = pathlib.Path(sys.argv[1])
          evidence = work / "evidence.json"
          evidence.write_text(json.dumps({"approved_account_id": "111122223333",
                                          "partition": "aws",
                                          "_note": "protected-equivalent CI fixture"}))
          evidence_sha = hashlib.sha256(evidence.read_bytes()).hexdigest()
          inventory_sha = "b" * 64
          candidate = {"candidate_id": "SYNTHETIC-CI-FIXTURE-CANDIDATE-1",
                       "candidate_manifest_sha256": "a" * 64}
          external = {"protected_tier": "TIER_2_PROTECTED",
                      "external_anchor_sha256": evidence_sha,
                      "external_inventory_sha256": inventory_sha}
          checks = [{"check_id": c["check_id"], "status": "PASSED"}
                    for c in pc.required_checks()]
          (work / "candidate.json").write_text(json.dumps(candidate))
          (work / "external.json").write_text(json.dumps(external))
          (work / "checks.json").write_text(json.dumps({"checks": checks}))

          # THE GATE 4N-I20A EXPLOIT: every binding fabricated, checks empty.
          (work / "exploit.json").write_text(json.dumps({
              "schema_version": pc.SCHEMA_VERSION,
              "certification_state": pc.PRODUCTION_CERTIFIED, "certifies_production": True,
              "candidate_id": "TOTALLY-MADE-UP-CANDIDATE",
              "candidate_manifest_sha256": "a" * 64, "head": "b" * 40,
              "index_tree_hash": "c" * 40, "commit_tree_hash": "d" * 40,
              "repository_diff_sha256": "e" * 64, "external_anchor_sha256": "f" * 64,
              "external_inventory_sha256": "0" * 64, "protected_tier": "TIER_2_PROTECTED",
              "certified_at_utc": "2026-08-01T00:00:00Z",
              "valid_until_utc": "2099-01-01T00:00:00Z", "checks": [],
              "certifier_provenance": "anything", "eligibility_sha256": "9" * 64}))

          def run(*args):
              return subprocess.run([sys.executable, "scripts/production_certification.py", *args],
                                    capture_output=True, text=True)

          refused = run("verify", "--artifact", str(work / "exploit.json"),
                        "--candidate-manifest", str(work / "candidate.json"),
                        "--external-binding", str(work / "external.json"))
          assert refused.returncode != 0, "THE PRODUCTION GATE PERMITTED A FABRICATED ARTIFACT"
          print("  exploit refused, exit", refused.returncode)

          assert run("verify", "--artifact", str(work / "exploit.json")).returncode != 0, \
              "an artifact-only verify mode is reachable"
          print("  artifact-only mode refused")

          elig = run("eligibility", "--tier2-evidence", str(evidence),
                     "--evidence-sha256", evidence_sha, "--inventory-sha256", inventory_sha,
                     "--candidate-manifest", str(work / "candidate.json"),
                     "--checks", str(work / "checks.json"), "--out", str(work / "elig.json"))
          assert elig.returncode == 0, elig.stderr
          # GATE 4N-I23, closing I22 architect finding H3. This step USED to assert that
          # `certify` succeeded and that the resulting PRODUCTION_CERTIFIED /
          # certifies_production:true artifact was permitted — so every CI run manufactured a
          # production certificate that the gate accepted. Its non-reuse rested on the mktemp
          # directory, not on any property of the artifact, and the "certifies nothing" claim
          # in this file's comments was something the mechanism could not actually conclude.
          # The candidate id now carries the SYNTHETIC- prefix, which makes non-certification
          # STRUCTURAL: it cannot be omitted from a fixture to make the pipeline go green.
          cert = run("certify", "--eligibility", str(work / "elig.json"),
                     "--certifier", "CI synthetic fixture", "--out", str(work / "cert.json"))
          assert cert.returncode != 0, (
              "CI produced a PRODUCTION_CERTIFIED artifact for a SYNTHETIC- candidate")
          assert "can never certify production" in (cert.stdout + cert.stderr), \
              cert.stdout + cert.stderr
          assert not (work / "cert.json").exists(), "a refused certification still wrote an artifact"
          print("  synthetic candidate refused certification structurally; CI certifies nothing")
          PY

      - name: Operator permission-set policy and cache-classification tests
        id: policy_tests
        if: always()
        env:
          SIGNALNEST_ANCHOR_TIER: TIER_1_SYNTHETIC
          SIGNALNEST_CANDIDATE_MANIFEST: ${{ github.workspace }}/tests/fixtures/candidate-manifest.json
        run: |
          .reader-venv/bin/pip install pytest
          # GATE 4N-I28BH-E5. The strict Gate-4N bootstrap adjudicates the AMBIENT Docker
          # configuration surface (docker_boundary), and a GitHub-hosted runner ships
          # ~/.docker/config.json carrying registry 'auths' — which docker_boundary declares
          # FATAL_IF_PRESENT because embedded credentials change which registry a push/pull
          # authenticates to. This graded step CONSUMES no Docker (docker_boundary only READS
          # state; no graded script shells out to the docker CLI), so its correct execution
          # surface is a hermetic HOME — exactly as scripts/empty_home_ci.sh establishes for the
          # local reproduction. DOCKER_CONFIG is deliberately NOT used to point elsewhere: the
          # boundary declares DOCKER_CONFIG itself FATAL_IF_PRESENT steering. HOME is set ONLY on
          # this pytest command, so the later "Build the reader image" / "In-image verification"
          # steps keep the runner HOME and its CI-provisioned daemon. A clean config with 'auths'
          # would still be FATAL — this relocates the surface, it does not weaken the rule.
          SANDBOX_HOME="$(mktemp -d)"
          HOME="$SANDBOX_HOME" PYTHONPATH="$GITHUB_WORKSPACE/scripts" .reader-venv/bin/python -m pytest tests/ -q -p signalnest_bootstrap -p pytest_session_guard

      # GATE 4N-I26C, wiring the three controls Gate 4N-I26B built and left unexecuted. A
      # control that is not invoked by the workflow is not a control; I26B's own evidence
      # recorded that gap rather than hiding it, and this closes it.
      - name: CI environment dataflow (availability precedes consumption)
        id: env_dataflow
        if: always()
        run: python3 scripts/ci_env_dataflow.py

      - name: Structural failure propagation (does failure fail the job?)
        id: failure_propagation
        if: always()
        run: python3 scripts/failure_propagation.py

      - name: True CI-equivalent harness (model-only in CI; the runner IS the execution)
        id: ci_harness
        if: always()
        run: python3 scripts/ci_harness.py --model-only

      # GATE 4N-I26C, closing the discovery half of I26B-01. As of Gate 4N-I28BH-B every
      # discovered SECURITY_CRITICAL collection carries an assurance ASSIGNMENT in
      # security-assurance-registry.json (SECURITY_UNGOVERNED == 0); inventory now demands that
      # assignment rather than a shortenable completeness_consumers entry, so an id can no longer go
      # green by leaving the old manifest. Both-directions meta on the registry is enforced too.
      - name: Security-critical list inventory and meta-completeness
        id: critical_lists
        if: always()
        run: python3 scripts/critical_list_inventory.py

      # GATE 4N-I26D. Both currently FAIL, reporting the real residual: 35 of 48
      # security-critical collections still have no completeness consumer, and not every
      # discovered site has executed behavioural proof. Wired anyway — I26B was faulted for
      # building controls and leaving them unexecuted, and a guard that reports the deficit is
      # worth more red than a green pipeline that never measured it.
      - name: Security-critical collection completeness
        id: collection_completeness
        if: always()
        run: python3 scripts/collection_completeness.py

      # GATE 4N-I28BH-B. The SIBLING assurance validator: it RUNS the property-specific control for
      # every SECURITY collection whose property collection_completeness cannot express — reviewed
      # integrity (authored vocabularies), exclusion-policy (reviewed carve-outs / independent
      # ceilings), cross-domain consistency, generated-contract equality, and runtime invariants —
      # via a CLOSED {assurance_kind: handler} dispatch that fails closed on an unknown kind or a
      # missing/invalid config. Membership/partition rows are confirmed wired to their existing
      # certificate-backed consumer. All 176 assignments must ACCEPT.
      - name: Security-collection assurance (property-specific, fail-closed)
        id: security_collection_assurance
        if: always()
        run: python3 scripts/security_collection_assurance.py

      - name: Gate 4N guard results
        if: always()
        run: |
          fail=0
          for r in "toolchain_pre=${{ steps.toolchain_pre.outcome }}" \
                   "module_tests=${{ steps.module_tests.outcome }}" \
                   "iam_module_tests=${{ steps.iam_module_tests.outcome }}" \
                   "toolchain_post=${{ steps.toolchain_post.outcome }}" \
                   "root_wiring=${{ steps.root_wiring.outcome }}" \
                   "boundaries=${{ steps.boundaries.outcome }}" \
                   "closure=${{ steps.closure.outcome }}" \
                   "anchor_tier=${{ steps.anchor_tier.outcome }}" \
                   "anchor=${{ steps.anchor.outcome }}" \
                   "deny_requirements=${{ steps.deny_requirements.outcome }}" \
                   "deny_probes=${{ steps.deny_probes.outcome }}" \
                   "lifecycle=${{ steps.lifecycle.outcome }}" \
                   "provenance=${{ steps.provenance.outcome }}" \
                   "exhaustion=${{ steps.exhaustion.outcome }}" \
                   "arn_model=${{ steps.arn_model.outcome }}" \
                   "policy_validation=${{ steps.policy_validation.outcome }}" \
                   "triangulation=${{ steps.triangulation.outcome }}" \
                   "expressions=${{ steps.expressions.outcome }}" \
                   "trust=${{ steps.trust.outcome }}" \
                   "oracle=${{ steps.oracle.outcome }}" \
                   "allow_axis=${{ steps.allow_axis.outcome }}" \
                   "rollout=${{ steps.rollout.outcome }}" \
                   "candidate_discovery=${{ steps.candidate_discovery.outcome }}" \
                   "putrolepolicy=${{ steps.putrolepolicy.outcome }}" \
                   "verifier_policy=${{ steps.verifier_policy.outcome }}" \
                   "verifier_ceiling=${{ steps.verifier_ceiling.outcome }}" \
                   "role_inventory=${{ steps.role_inventory.outcome }}" \
                   "containment=${{ steps.containment.outcome }}" \
                   "ci_invocation=${{ steps.ci_invocation.outcome }}" \
                   "site_coverage=${{ steps.site_coverage.outcome }}" \
                   "gate_dependencies=${{ steps.gate_dependencies.outcome }}" \
                   "env_dataflow=${{ steps.env_dataflow.outcome }}" \
                   "failure_propagation=${{ steps.failure_propagation.outcome }}" \
                   "ci_harness=${{ steps.ci_harness.outcome }}" \
                   "critical_lists=${{ steps.critical_lists.outcome }}" \
                   "collection_completeness=${{ steps.collection_completeness.outcome }}" \
                   "security_collection_assurance=${{ steps.security_collection_assurance.outcome }}" \
                   "mutation_discovery=${{ steps.mutation_discovery.outcome }}" \
                   "evidence_binding=${{ steps.evidence_binding.outcome }}" \
                   "package_requirements=${{ steps.package_requirements.outcome }}" \
                   "package_coherence=${{ steps.package_coherence.outcome }}" \
                   "provenance_coverage=${{ steps.provenance_coverage.outcome }}" \
                   "tracked_state=${{ steps.tracked_state.outcome }}" \
                   "certification=${{ steps.certification.outcome }}" \
                   "certification_gate=${{ steps.certification_gate.outcome }}" \
                   "policy_tests=${{ steps.policy_tests.outcome }}"; do
            echo "  $r"
            case "$r" in *=success) ;; *) fail=1 ;; esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more Gate 4N guards did not succeed." >&2
            exit 1
          fi

      - name: Build the reader image
        uses: docker/build-push-action@v6
        with:
          context: apps/revision-reader
          file: apps/revision-reader/Dockerfile
          target: reader
          platforms: linux/amd64
          tags: signalnest-revision-reader:ci
          load: true
          # SYNTHETIC destination pins for CI only — never a real endpoint. They must be
          # non-empty (the Dockerfile fails the build otherwise) and a plausible RDS-style
          # host so the reader's host validation admits them; the in-image band then proves
          # the reader connects only to THIS baked host and rejects any other.
          build-args: |
            EXPECTED_DB_HOST=test-db.abc123.us-east-1.rds.amazonaws.com
            EXPECTED_DB_NAME=signalnest
            EXPECTED_DB_USER=signalnest_app

      - name: In-image verification band
        run: |
          image="signalnest-revision-reader:ci"

          echo "== (1) the image runs and psycopg imports (catches a builder/base ABI mismatch) =="
          docker run --rm --network none --entrypoint /usr/bin/python3.11 "$image" \
            -c "import psycopg; print('psycopg import ok')"

          echo "== (2) the image CANNOT migrate: Alembic and the application are absent =="
          for mod in alembic sqlalchemy app app.db.migrate pydantic boto3 fastapi; do
            if docker run --rm --network none --entrypoint /usr/bin/python3.11 "$image" -c "import ${mod}" 2>/dev/null; then
              echo "::error::FORBIDDEN MODULE PRESENT: ${mod} imports inside the reader image." >&2
              exit 1
            fi
          done

          echo "== (3) no shell interpreter is present (defence in depth) =="
          for sh in /bin/sh /bin/bash /usr/bin/sh /bin/busybox; do
            if docker run --rm --network none --entrypoint "$sh" "$image" -c "id" 2>/dev/null; then
              echo "::error::A shell is present at ${sh}." >&2
              exit 1
            fi
          done

          echo "== (4) fixed exec-form entrypoint, empty CMD, non-root uid =="
          entry="$(docker inspect --format '{{ json .Config.Entrypoint }}' "$image")"
          test "$entry" = '["/usr/bin/python3.11","-m","revision_reader.reader"]'
          cmd="$(docker inspect --format '{{ json .Config.Cmd }}' "$image")"
          case "$cmd" in 'null'|'[]') : ;; *) echo "::error::CMD is ${cmd}, expected empty." >&2; exit 1 ;; esac
          test "$(docker inspect --format '{{ .Config.User }}' "$image")" = "10001:10001"

          echo "== (5) an override command becomes argv and is REJECTED (exit 50) =="
          # This is the control itself: ECS ContainerOverride carries `command` but not
          # `entryPoint`, so an override lands as argv to a program that refuses all argv.
          # `-c` is probed deliberately — `-m <module>` ends CPython option parsing, so it
          # arrives as argv rather than as a flag that would execute arbitrary code.
          for probe in "--help" "-c|import os; os.system('id')" "-m|app.db.migrate" "upgrade" "downgrade|base"; do
            IFS='|' read -r -a argv <<< "$probe"
            rc=0
            docker run --rm --network none -e DATABASE_URL='postgresql://u:p@h:5432/d?sslmode=require' \
              "$image" "${argv[@]}" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -ne 50 ]; then
              echo "::error::Override [${argv[*]}] exited ${rc}, expected 50 (argv rejected)." >&2
              exit 1
            fi
          done

          echo "== (6) destination is BAKED: any host but the baked one fails closed =="
          # Gate 4J.1. The host/db/role are baked (build args above); the reader connects to
          # the baked host regardless of the DSN and takes only the password from it. So
          # every redirect shape fails closed at CONFIG (51) — the DSN host is never dialled.
          BAKED_HOST=test-db.abc123.us-east-1.rds.amazonaws.com
          expect() {
            want="$1"; shift
            rc=0
            out="$(docker run --rm --network none "$@" "$image" 2>&1)" || rc=$?
            if [ "$rc" -ne "$want" ]; then
              echo "::error::Expected exit ${want}, got ${rc}. Output: ${out}" >&2
              exit 1
            fi
            if printf '%s' "$out" | grep -Eq 'Traceback|password|secret|@[a-z0-9.-]+:5432'; then
              echo "::error::Reader output disclosed a traceback or credential material." >&2
              exit 1
            fi
          }
          expect 51                                                             # no DSN at all
          # BLOCKING 1 (confirmed exploit): arbitrary DNS host / IP -> tamper detector, never dialled.
          expect 51 -e DATABASE_URL='postgresql://u:pw@attacker.example.com:5432/d?sslmode=require'
          expect 51 -e DATABASE_URL='postgresql://u:pw@203.0.113.9:5432/d?sslmode=require'
          # BLOCKING 2 (confirmed exploit): the exact bracketed-authority bypass.
          expect 51 -e DATABASE_URL='postgresql://u:pw@evil.invalid%2Cdb.invalid[v1.x]/d?sslmode=require'
          # BLOCKING 3 (new): a percent-encoded NUL in the password — invisible raw, a NUL
          # after unquote that would truncate libpq's conninfo. Gated on the DECODED value.
          expect 51 -e DATABASE_URL="postgresql+psycopg://signalnest_app:s3cr3t%00pw@${BAKED_HOST}:5432/signalnest?sslmode=require"
          # Wrong scheme, multi-host, and userinfo '@' ambiguity all fail closed.
          expect 51 -e DATABASE_URL="mysql://signalnest_app:pw@${BAKED_HOST}:5432/signalnest?sslmode=require"
          expect 51 -e DATABASE_URL="postgresql://signalnest_app:pw@evil.invalid,${BAKED_HOST}:5432/d?sslmode=require"
          expect 51 -e DATABASE_URL='postgresql://u:p@ss@evil.invalid:443/d?sslmode=require'
          # A DSN naming the BAKED host with a valid, decodable password reaches connect: the
          # discrete-param path (driver-suffix normalise + '%40' password decode) dials the
          # baked host, which will not answer under --network none -> CONNECT_FAILED (52).
          # This is the positive control that the reader actually connects, not just rejects.
          expect 52 -e DATABASE_URL="postgresql+psycopg://signalnest_app:s3cr3tpw@${BAKED_HOST}:5432/signalnest?sslmode=require"
          expect 52 -e DATABASE_URL="postgresql://signalnest_app:p%40ss@${BAKED_HOST}:5432/signalnest?sslmode=require"

          echo "== (7) baked pins and the CA bundle are present and non-empty =="
          docker run --rm --network none --entrypoint /usr/bin/python3.11 "$image" -c "
          import os
          from revision_reader import _pinned
          assert _pinned.EXPECTED_DB_HOST == '${BAKED_HOST}', _pinned.EXPECTED_DB_HOST
          assert _pinned.EXPECTED_DB_NAME and _pinned.EXPECTED_DB_USER
          assert os.path.isfile(_pinned.CA_BUNDLE_PATH), _pinned.CA_BUNDLE_PATH
          print('pins + CA present ok')"

          echo "== (8) the baked CA bundle is byte-identical to the reviewed, pinned asset =="
          got="$(docker run --rm --network none --entrypoint /usr/bin/python3.11 "$image" -c "
          import hashlib, pathlib
          print(hashlib.sha256(pathlib.Path('/etc/ssl/rds/rds-global-bundle.pem').read_bytes()).hexdigest())")"
          want="e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3"
          test "$got" = "$want" || { echo "::error::baked CA sha256 ${got} != ${want}" >&2; exit 1; }

          echo "== (9) exact interpreter patch version (logged, not asserted — drift visible) =="
          docker run --rm --network none --entrypoint /usr/bin/python3.11 "$image" \
            -c "import sys; print('reader interpreter:', sys.version)"

          echo "revision-reader in-image verification: PASS"
