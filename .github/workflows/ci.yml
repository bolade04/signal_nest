name: CI

# Phase 1-2 quality gates. Everything below runs in the project's default
# zero-dependency local mode: SQLite, in-process queue, in-memory cache,
# brute-force vector index, local-file storage and the deterministic mock LLM.
# No Docker, PostgreSQL, Redis or paid API keys are required.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

# Newer commits on the same branch / PR cancel older in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read repository contents.
permissions:
  contents: read

# Strict shell for every `run:` step. The default GitHub shell is `bash -e {0}`
# (no pipefail), so `cmd | tee log` reports tee's exit status and a failing
# quality command is silently masked as success. Enabling pipefail propagates
# the left-hand failure; -u catches unset variables; -e stops on first error.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  NODE_VERSION: '20'          # repository engines: node >=20 <21
  PYTHON_VERSION: '3.12'      # backend supports >=3.11; 3.12 matches development
  # Backend CI runtime configuration — actual Settings field names (see
  # apps/api/app/core/config.py). Safe, non-secret, zero-dependency values.
  APP_MODE: local
  ENVIRONMENT: test
  DATABASE_URL: sqlite:///./signalnest.db
  QUEUE_BACKEND: inprocess
  CACHE_BACKEND: memory
  VECTOR_BACKEND: bruteforce
  STORAGE_BACKEND: local
  LLM_PROVIDER: mock
  LLM_MOCK_SEED: signalnest-ci

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      # In CI the frontend is tested against MSW and built statically; the API
      # base URL stays blank (same as local dev through the Vite proxy).
      VITE_API_BASE_URL: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: CI failure-propagation regression test
        # Proves `cmd | tee log` fails the step when `cmd` fails under the
        # workflow's strict shell (regression guard for the pipefail masking bug).
        run: npm run test:ci-pipefail

      - name: Install workspace dependencies
        run: |
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm-ci.log

      - name: Lint (zero warnings)
        run: npm run lint 2>&1 | tee ci-logs/frontend-lint.log

      - name: Type-check
        run: npm run type-check 2>&1 | tee ci-logs/frontend-typecheck.log

      - name: Test
        run: npm run test 2>&1 | tee ci-logs/frontend-test.log

      - name: Production build
        run: npm run build 2>&1 | tee ci-logs/frontend-build.log

      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-logs
          path: ci-logs/
          retention-days: 7

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    # A disposable PostgreSQL service so the dialect-aware durable-job claim
    # (FOR UPDATE SKIP LOCKED) is exercised against a real database. The app under
    # test still runs in default local mode (SQLite) — only the opt-in, gated
    # integration test reads TEST_POSTGRES_URL and connects here directly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalnest
          POSTGRES_PASSWORD: signalnest
          POSTGRES_DB: signalnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalnest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Create fresh API virtualenv and install (dev extras)
        run: |
          mkdir -p ci-logs
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --upgrade pip
          apps/api/.venv/bin/pip install -e "apps/api[dev]" 2>&1 | tee ci-logs/pip-install.log

      - name: Ruff check
        run: apps/api/.venv/bin/python -m ruff check apps/api 2>&1 | tee ci-logs/backend-ruff.log

      - name: Backend tests
        # Invoke the repo bash scripts directly (they use apps/api/.venv); this
        # job sets up Python only, so it must not depend on npm/Node.
        # A migrated + seeded DB is required for the HTTP-isolation integration tests.
        # TEST_POSTGRES_URL points the opt-in, gated cross-worker claim test at the
        # disposable postgres service above; every other test stays on local SQLite.
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://signalnest:signalnest@localhost:5432/signalnest_test
        run: |
          bash scripts/demo-setup.sh 2>&1 | tee ci-logs/backend-demo-setup.log
          bash scripts/run-tests-api.sh 2>&1 | tee ci-logs/backend-pytest.log

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: ci-logs/
          retention-days: 7

  migration-and-contract:
    name: Migrations and API contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm-ci.log
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --upgrade pip
          apps/api/.venv/bin/pip install -e "apps/api[dev]" 2>&1 | tee ci-logs/pip-install.log

      - name: Migration round-trip + seed idempotency
        working-directory: apps/api
        run: |
          PY=.venv/bin/python
          echo "== fresh database: remove any pre-existing SQLite file =="
          rm -f signalnest.db
          echo "== upgrade empty database -> head =="
          $PY -m alembic upgrade head
          echo "== schema-drift check (expect: no new upgrade operations) =="
          $PY -m alembic check
          echo "== seed =="
          $PY -m app.db.seed
          echo "== seed again (idempotency: no duplicates, safe re-run) =="
          $PY -m app.db.seed
          echo "== downgrade to base =="
          $PY -m alembic downgrade base
          echo "== upgrade back to head =="
          $PY -m alembic upgrade head
          echo "== reset + reseed (documented seed:reset workflow) =="
          $PY -m app.db.seed --reset

      - name: OpenAPI regeneration + contract-drift check
        run: |
          npm run gen:types 2>&1 | tee ci-logs/gen-types.log
          echo "== fail if generation produced an uncommitted diff =="
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts

      - name: Show contract drift on failure
        if: failure()
        run: git --no-pager diff -- apps/api/openapi.json apps/web/src/api/schema.d.ts || true

      - name: Upload migration/contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migration-contract-logs
          path: ci-logs/
          retention-days: 7

  container-build:
    name: Container build and security
    runs-on: ubuntu-latest
    # Batch 4: build the production API + worker images, prove they are non-root
    # and secret-free, and exercise the migration actor + entrypoints end-to-end.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: api
          tags: signalnest-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: worker
          tags: signalnest-worker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security check — non-root, no secrets (API)
        run: bash scripts/docker-security-check.sh signalnest-api:ci

      - name: Security check — non-root, no secrets (worker)
        run: bash scripts/docker-security-check.sh signalnest-worker:ci

      - name: API image imports cleanly
        run: docker run --rm --entrypoint python signalnest-api:ci -c "import app.main; print('api import ok')"

      - name: Migration actor + schema-compat check run in the image
        # Point the DB at writable /tmp (the image is read-only-root compatible;
        # only /tmp is writable). Upgrade a fresh SQLite DB to head, then verify
        # the startup schema-compatibility check reports compatible (exit 0).
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/ci.db --entrypoint sh signalnest-worker:ci -c '
            python -m app.db.migrate upgrade &&
            python -m app.db.migrate check
          '

      - name: Worker refuses an un-migrated database (schema gate)
        # A fresh, empty database is "uninitialized"; the compatibility check must
        # exit non-zero rather than silently running or migrating.
        run: |
          if docker run --rm -e DATABASE_URL=sqlite:////tmp/empty.db --entrypoint python signalnest-worker:ci -m app.db.migrate check; then
            echo "FAIL: check unexpectedly passed on an uninitialized database" >&2
            exit 1
          fi
          echo "ok: schema gate correctly rejects an uninitialized database"

      - name: Bare migration actor command + revision tools (exact ECS shape, fail-closed)
        # ECS runs the migration actor with command = ["python","-m","app.db.migrate"]
        # — NO subcommand (infra/aws/modules/ecs/main.tf). The steps above only
        # exercise the explicit `upgrade`/`check` subcommands, which dispatch to a
        # DIFFERENT function; this step executes the real bare command end to end
        # (upgrade + read-back verification), plus the raw revision reader and the
        # offline comparator, against controlled SQLite state with no network.
        # Positive event output, distinct failure classifications, and no
        # secret-bearing output are all asserted.
        run: |
          docker run --rm --network none -e LOG_FORMAT=json --entrypoint sh signalnest-worker:ci -c '
            set -eu
            export DATABASE_URL=sqlite:////tmp/bare.db

            echo "== (1) bare command, fresh DB: exit 0 + verification event =="
            python -m app.db.migrate > /tmp/out1.json 2> /tmp/err1.log
            grep -q "\"event\": \"migrate.upgrade_verify.done\"" /tmp/out1.json
            grep -q "\"code_head\"" /tmp/out1.json
            grep -q "\"db_revision\"" /tmp/out1.json
            test ! -s /tmp/err1.log
            ! grep -q "Traceback" /tmp/out1.json

            echo "== (2) bare command, corrupted version table: exit 4 + fixed classification =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27aaaaaaaaaaaa\x27)\"); c.commit()"
            rc=0; python -m app.db.migrate > /tmp/out2.json 2> /tmp/err2.log || rc=$?
            test "$rc" -eq 4
            grep -q "\"event\": \"migrate.upgrade.failed\"" /tmp/out2.json
            grep -q "\"error_class\"" /tmp/out2.json
            ! grep -q "Traceback" /tmp/out2.json
            ! grep -q "Traceback" /tmp/err2.log

            echo "== (3) revision tools import cleanly =="
            python -c "import app.db.revision_status, app.db.revision_compare; print(\"revision tools import ok\")"

            echo "== (4) reader: one valid row -> exactly one revision line; matches comparator =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version WHERE version_num=\x27aaaaaaaaaaaa\x27\"); c.commit()"
            rev=$(python -m app.db.revision_status)
            echo "$rev" | grep -Eq "^[0-9a-f]{12}$"
            python -m app.db.revision_status | python -m app.db.revision_compare

            echo "== (5) reader: stray argv rejected (30) =="
            rc=0; python -m app.db.revision_status extra >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 30

            echo "== (6) reader: zero rows (33) =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version\"); c.commit()"
            rc=0; python -m app.db.revision_status >/dev/null 2>/tmp/err33 || rc=$?
            test "$rc" -eq 33 && grep -q "no-revision-rows" /tmp/err33

            echo "== (7) reader: multiple rows (34) =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.executemany(\"INSERT INTO alembic_version VALUES (?)\", [(\"aaaaaaaaaaaa\",),(\"bbbbbbbbbbbb\",)]); c.commit()"
            rc=0; python -m app.db.revision_status >/dev/null 2>/tmp/err34 || rc=$?
            test "$rc" -eq 34 && grep -q "multiple-revision-rows" /tmp/err34

            echo "== (8) reader: malformed revision (35) =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27NOTAREVISION\x27)\"); c.commit()"
            rc=0; python -m app.db.revision_status >/dev/null 2>/tmp/err35 || rc=$?
            test "$rc" -eq 35 && grep -q "malformed-revision" /tmp/err35

            echo "== (9) reader: version table missing (32) =="
            python -c "import sqlite3; sqlite3.connect(\"/tmp/fresh.db\").close()"
            rc=0; DATABASE_URL=sqlite:////tmp/fresh.db python -m app.db.revision_status >/dev/null 2>/tmp/err32 || rc=$?
            test "$rc" -eq 32 && grep -q "version-table-missing" /tmp/err32

            echo "== (10) comparator: mismatch (43), multi-line (41), empty (41) =="
            rc=0; printf "aaaaaaaaaaaa\n" | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 43
            rc=0; printf "aaaaaaaaaaaa\nbbbbbbbbbbbb\n" | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 41
            rc=0; printf "" | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 41

            echo "== (10b) end-to-end provenance: DB at a NON-head revision -> reader|comparator must MISMATCH (43) =="
            # A reader that prints the code head instead of the database value
            # would make the pipe above tautological; this closes it.
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27aaaaaaaaaaaa\x27)\"); c.commit()"
            rc=0; python -m app.db.revision_status | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 43

            echo "== (11) no secret-bearing output: the database URL never appears =="
            ! grep -q "sqlite:" /tmp/out1.json
            ! grep -q "sqlite:" /tmp/out2.json

            echo "bare-command + revision-tools in-image verification: PASS"
          '

  integration-smoke:
    name: Integration smoke
    runs-on: ubuntu-latest
    # Only run once the core quality + migration gates are green.
    needs: [frontend-quality, backend-quality, migration-and-contract]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Create fresh API virtualenv and install
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --upgrade pip
          apps/api/.venv/bin/pip install -e "apps/api[dev]"

      - name: Prepare a fresh, migrated + seeded demo database
        # Python-only job: call the bash script directly (no npm/Node dependency).
        run: |
          rm -f apps/api/signalnest.db
          bash scripts/demo-setup.sh

      - name: HTTP isolation smoke test
        # ci-smoke.sh starts uvicorn, waits on /health with a bounded loop, runs
        # scripts/smoke_http.py, and always stops the server (trap on EXIT).
        run: bash scripts/ci-smoke.sh

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: api-smoke.log
          retention-days: 7

  revision-reader:
    name: Revision reader (unit, IaC contract, in-image)
    runs-on: ubuntu-latest
    # Gate 4J. The reader's safety is a set of ABSENCES — no Alembic, no application
    # package, no shell, no argv acceptance, no entryPoint in the task definition. An
    # absence does not fail loudly when it stops holding, so every one is asserted here at
    # PR time. reader-publish.yml replays the in-image band at publish time as a
    # fail-closed check against the artefact that is actually pushed.
    #
    # GATE 4N-I26B, closing I25's VAL-CI. The anchor tier used to be published mid-job with
    # `>> "$GITHUB_ENV"`, which reaches only SUBSEQUENT steps — so `closure`, which ran two
    # steps earlier, executed with it UNSET and died on an uncaught module-level AnchorError.
    # CI was deterministically red and no local run reproduced it, because the guard harness
    # pre-exported the variable before every step and therefore measured a state the runner
    # never has. Declaring it at JOB scope makes it available to every step from the first,
    # which removes the ordering hazard rather than reordering around it: there is now exactly
    # one producer and it cannot come after any consumer. scripts/ci_env_dataflow.py proves
    # availability precedes consumption for every consumed variable, and fails closed on any
    # it cannot resolve.
    env:
      SIGNALNEST_ANCHOR_TIER: TIER_1_SYNTHETIC
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/revision-reader/pyproject.toml

      - name: Install the reader (editable) with its dev extra
        # Editable, so the tests exercise the working tree rather than a copy in
        # site-packages that could drift from what the image builds.
        run: |
          python -m venv .reader-venv
          .reader-venv/bin/pip install --upgrade pip
          .reader-venv/bin/pip install -e "apps/revision-reader[dev]"
          # GATE 4N-I28BH-E2. The main Gate-4N security suite runs UNDER this reader venv
          # (the "Operator permission-set policy and cache-classification tests" step), and its
          # strict bootstrap (signalnest_bootstrap.establish -> executable_inventory) imports
          # yaml. The venv is isolated (no --system-site-packages), so the system-python install
          # of the pinned Gate contract below does NOT reach it. Install the SAME pinned contract
          # here so every interpreter that executes a YAML-dependent Gate consumer has PyYAML.
          .reader-venv/bin/pip install -r scripts/requirements-gate.txt

      # GATE 4N-I26C. The Gate 4N guards run under the SYSTEM python3, not the reader venv, and
      # three of them parse this workflow as YAML. Gate 4N-I26B shipped them depending on a
      # PyYAML nothing installed: on a runner all three would have exited 2 "refused", which
      # reads like a policy decision rather than a missing package. Installed HERE, before the
      # first guard, from the pinned contract in scripts/requirements-gate.txt.
      - name: Install Gate 4N guard dependencies
        run: python3 -m pip install -r scripts/requirements-gate.txt

      - name: Gate 4N guard dependency contract
        id: gate_dependencies
        if: always()
        run: python3 scripts/check_gate_dependencies.py

      - name: Ruff check
        run: .reader-venv/bin/python -m ruff check apps/revision-reader

      - name: Reader unit and build-contract tests
        working-directory: apps/revision-reader
        run: ../../.reader-venv/bin/python -m pytest tests -q

      # Gate 4N-I8: the iam module now carries boundary_durability.tftest.hcl, which proves
      # the permissions boundary reaches all five roles and that a null input is the removal
      # state. Offline, mocked provider, no backend — same shape as the reader tests.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # Pinned to the Gate 4N execution contract. Without this the action installs
          # `latest`, and scripts/check_toolchain_integrity.py would assert a version the
          # workflow never established.
          tofu_version: 1.12.5
          tofu_wrapper: false

      # --- Gate 4N-I4: operator permission and toolchain guards -------------------
      # Ordering matters and was wrong in Gate 4N-I3, where the toolchain check ran
      # AFTER the module init that legitimately creates a module-local .terraform,
      # failed on its mere existence, and — because steps are sequential — suppressed
      # the policy tests entirely. The corrected graph is:
      #   1. sanitize the environment BEFORE anything initialises
      #   2. initialise the module (creates an EXPECTED cache)
      #   3. re-verify the toolchain, now classifying that cache by contents
      #   4. run the policy tests regardless of step 3's outcome
      #   5. a final gate fails the job if any required step failed
      # No step uses unconditional continue-on-error; every failure still fails the job.
      - name: IAM module boundary durability contract tests
        id: iam_module_tests
        if: always()
        working-directory: infra/aws/modules/iam
        run: |
          tofu init -backend=false -input=false
          tofu test

      - name: Toolchain integrity — pre-init environment sanitization
        id: toolchain_pre
        run: python3 scripts/check_toolchain_integrity.py

      - name: Reader IaC contract tests (offline, fully mocked provider)
        id: module_tests
        working-directory: infra/aws/modules/revision_reader
        run: |
          tofu fmt -check -diff .
          tofu init -backend=false -input=false
          tofu test

      - name: Toolchain integrity — post-init cache classification
        id: toolchain_post
        if: always() && steps.toolchain_pre.outcome != 'skipped'
        run: python3 scripts/check_toolchain_integrity.py

      # INFRA-9 B-3. Root-wiring regression guard: OpenTofu itself is the configuration
      # oracle (no HCL parsing — a prior hand-rolled scanner fell to six rounds of
      # fail-open evasions). The checker copies the git-tracked infra/aws tree into
      # $RUNNER_TEMP (digest-bound both before AND after the plan), overrides the
      # backend to `local` inside the copy only, installs the pinned provider from a
      # filesystem mirror built from the module-test cache the steps above created
      # (verified against the committed root lockfile h1 set and provider-binary-pin;
      # no registry download, no network fallback), then completes an offline
      # `tofu plan -refresh=false` against a 127.0.0.1-only synthetic STS stub and
      # asserts the provider wiring in `tofu show -json` (primary) and `tofu graph`
      # (independent witness): aws.revision_reader carries exactly {region}; the full
      # 15-resource aws_* reader roster binds to it; nothing else does; the default provider
      # keeps {default_tags, region}; exactly one module call sources the reader.
      # --mode full additionally runs the complete negative mutation battery on
      # doctored copies — every battery row must fail at its designated stage with its
      # expected signature, so plan-JSON/DOT format drift fails closed instead of
      # going silently green. This step also gives root main.tf/providers.tf their
      # fmt/validate gate. The committed S3 backend is NEVER initialized; the
      # subprocess environment is constructed from an allowlist (synthetic
      # credentials, IMDS disabled, localhost endpoint), never inherited.
      - name: Root wiring — reader provider mapping and aliased-surface guard
        id: root_wiring
        if: always()
        run: python3 scripts/root_wiring_check.py --mode full

      - name: IAM role permissions-boundary coverage (fail-closed)
        id: boundaries
        if: always()
        run: python3 scripts/check-iam-role-boundaries.py

      # Runs even when a diagnostic check above failed: a red toolchain check must
      # never hide a policy regression. Its own failure still fails the job via the gate.
      - name: Closure verification (repository graph JOIN provider API map)
        id: closure
        if: always()
        run: python3 scripts/verify_closure.py

      # Independent of the policy generators: derives expected ARNs from repository
      # expressions, a live inventory and AWS ARN rules, and fails closed on any
      # derivation it cannot resolve.
      # The account is anchored OUTSIDE the repository. A repository-wide replacement now
      # produces a MISMATCH instead of silent agreement.
      # GATE 4N-I13: ordinary CI declares TIER_1_SYNTHETIC explicitly. There is no default
      # and no discovery — an undeclared tier fails closed rather than reading a home
      # directory. Tier 1 validates MECHANICS and certifies nothing about production
      # identity; that is Tier 2's job, contracted separately below.
      - name: Declare Tier 1 synthetic anchor
        id: anchor_tier
        if: always()
        run: |
          # GATE 4N-I26B. The `>> "$GITHUB_ENV"` write that used to be here is GONE: the tier is
          # declared once at job scope, so this step validates it instead of publishing it. Two
          # producers for one value is how a consumer ends up reading the wrong one.
          test -f tests/fixtures/synthetic-anchor.json
          test "$SIGNALNEST_ANCHOR_TIER" = "TIER_1_SYNTHETIC"
          python3 scripts/anchor_loader.py --tier TIER_1_SYNTHETIC

      - name: External identity anchor join
        id: anchor
        if: always()
        run: python3 scripts/external_anchor.py

      # Deny requirements come from the external incident ledger plus architecture
      # invariants, never from the policy generators.
      - name: Independent Deny requirements
        id: deny_requirements
        if: always()
        run: python3 scripts/deny_requirements.py

      # Every resource-scoped Deny is probed at the resource it protects, and every Deny
      # statement is deleted in turn to prove something notices.
      - name: Resource-specific Deny probes
        id: deny_probes
        if: always()
        run: python3 scripts/resource_deny_probes.py

      # Reconciles every mandatory Deny across incident ledger, architecture invariant,
      # protected resource, generated policy and explicit probe.
      # Final-defender exhaustion replaced the unfalsifiable I10 scorer.
      # Every lifecycle step has an owner, and each owner is PROVEN to hold its action
      # against the generated policy — not asserted in prose.
      - name: RoleBootstrap lifecycle owner graph
        id: lifecycle
        if: always()
        run: python3 scripts/role_bootstrap_lifecycle.py

      # Every provenance label checked against an exact source and field; weak labels
      # cannot authorize production.
      - name: Provenance cross-check
        id: provenance
        if: always()
        run: python3 scripts/provenance.py

      - name: Deny final-defender exhaustion
        id: exhaustion
        if: always()
        run: python3 scripts/deny_exhaustion.py

      # Component-wise ARN comparison; a regex cannot see a one-character corruption.
      - name: Semantic critical-ARN model
        id: arn_model
        if: always()
