name: CI

# Phase 1-2 quality gates. Everything below runs in the project's default
# zero-dependency local mode: SQLite, in-process queue, in-memory cache,
# brute-force vector index, local-file storage and the deterministic mock LLM.
# No Docker, PostgreSQL, Redis or paid API keys are required.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

# Concurrency (2026-10-22, queued CI-6 follow-up). pull_request runs: one group per PR NUMBER — not the
# head branch name, since two PRs whose source branches share a name (fork PRs included) must not cancel
# each other — and a newer push to that PR cancels its older in-flight run (a superseded run only wastes
# runners). Every other event — push to main or feature/**, workflow_dispatch — gets a group of its own,
# keyed by the run id, so a push-to-main run is never cancelled by, nor queued behind, a later push: it
# always completes. Before 2026-10-22 one group (`pull_request.number || ref`) cancelled for every event.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only read repository contents.
permissions:
  contents: read

# Strict shell for every `run:` step. The default GitHub shell is `bash -e {0}`
# (no pipefail), so `cmd | tee log` reports tee's exit status and a failing
# quality command is silently masked as success. Enabling pipefail propagates
# the left-hand failure; -u catches unset variables; -e stops on first error.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  NODE_VERSION: '20'          # repository engines: node >=20 <21
  PYTHON_VERSION: '3.12'      # backend supports >=3.11; 3.12 matches development
  # Backend CI runtime configuration — actual Settings field names (see
  # apps/api/app/core/config.py). Safe, non-secret, zero-dependency values.
  APP_MODE: local
  ENVIRONMENT: test
  DATABASE_URL: sqlite:///./signalnest.db
  QUEUE_BACKEND: inprocess
  CACHE_BACKEND: memory
  VECTOR_BACKEND: bruteforce
  STORAGE_BACKEND: local
  LLM_PROVIDER: mock
  LLM_MOCK_SEED: signalnest-ci

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      # In CI the frontend is tested against MSW and built statically; the API
      # base URL stays blank (same as local dev through the Vite proxy).
      VITE_API_BASE_URL: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: CI failure-propagation regression test
        # Proves `cmd | tee log` fails the step when `cmd` fails under the
        # workflow's strict shell (regression guard for the pipefail masking bug).
        run: npm run test:ci-pipefail

      - name: Install workspace dependencies
        run: |
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm-ci.log

      - name: Lint (zero warnings)
        run: npm run lint 2>&1 | tee ci-logs/frontend-lint.log

      - name: Type-check
        run: npm run type-check 2>&1 | tee ci-logs/frontend-typecheck.log

      - name: Test
        # P6-CI-8: coverage is enabled by the CI env var in apps/web/vite.config.ts (report only, no threshold).
        run: |
          npm run test 2>&1 | tee ci-logs/frontend-test.log
          { echo '### Web coverage (report only, no threshold)'; grep -E '^(Statements|Branches|Functions|Lines) +:' ci-logs/frontend-test.log || echo 'coverage total not found'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web coverage report (P6-CI-8, report only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: ci-logs/coverage-web/
          retention-days: 30
          if-no-files-found: warn

      - name: Production build
        run: npm run build 2>&1 | tee ci-logs/frontend-build.log

      # --- Browser customer flow (P6-CI-2) -------------------------------------------
      # The bundle built above is EXECUTED here, in a real Chromium, against a real
      # local API and the durable worker on a disposable migrated SQLite database.
      # The backend install mirrors the Integration smoke job (hash-locked
      # requirements, editable install); the browser build is the one pinned by the
      # Playwright version in the lockfile. Modes are the job's deterministic defaults
      # (fixture connectors, mock LLM); the harness refuses any live provider.
      - name: Set up Python (browser proof backend)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Create fresh API virtualenv and install (browser proof backend)
        # P6-CI-6 coverage gaps (operator order 2026-10-20): pip and the setuptools build backend come from the
        # hash-locked apps/api/requirements-bootstrap.txt (the interpreter's bundled pip performs that one install and
        # is replaced by the locked pip) instead of an unpinned self-upgrade, and the editable install runs with
        # --no-build-isolation, so no unpinned build dependency is fetched; --only-binary :all: refuses a source build of any locked
        # dependency, whose build requirements pip would otherwise fetch unpinned and unhashed; --isolated ignores PIP_* variables and
        # user pip configuration, through which a constraint file could re-enable one. The venv is created with --clear,
        # so nothing an earlier step left there survives, and the last line makes it read-only, so no later step runs with it
        # writable; it is scanned as installed below.
        run: |
          python -m venv --clear apps/api/.venv
          apps/api/.venv/bin/python -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r apps/api/requirements-bootstrap.txt
          apps/api/.venv/bin/pip install --isolated --require-hashes --only-binary :all: -r apps/api/requirements-dev.txt
          apps/api/.venv/bin/pip install --no-deps --no-build-isolation -e apps/api
          python3 security/stage_inputs.py readonly apps/api/.venv

      # P6-CI-6 coverage gaps (operator order 2026-10-20): the API venv this job installed is scanned AS INSTALLED,
      # reconciled against its own pip inspect inventory and against its hash locks (installed == the locks' pins plus
      # the editable project), and the packages its pip vendors without dist-info are analysed from a staged pin list.
      # The environment was made read-only at the end of its own install, so no later step ran with it writable, and both of
      # its gates require that, so an ordinary later install or uninstall fails its step instead of escaping both
      # inventories; the inventory is taken again at the end of the job, so an install that does land fails completeness.
      # The Trivy binary on the job's PATH is analysed and bound to its pinned release digest (security/scanner-binaries.json).
      - name: Inventory the API venv as installed and stage the packages its installer vendors
        if: always()
        run: |
          mkdir -p security-reports
          apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed.json
          python3 security/stage_inputs.py vendored --out .vendored-pins --env api-venv apps/api/.venv security-reports/api-venv-installed.json

      - name: Trivy — API venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: apps/api/.venv
          scanners: vuln
          format: json
          output: security-reports/trivy-api-venv-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — packages vendored inside the installed environments (staged pin lists)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins
          scanners: vuln
          format: json
          output: security-reports/trivy-vendored-pins-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Stage the scanner binary on this job's PATH
        if: always()
        run: python3 security/stage_inputs.py binaries --pins security/scanner-binaries.json --job frontend-quality --out .scanner-binaries --manifest security-reports/scanner-binaries-manifest.json

      - name: Trivy — the scanner binary on this job's PATH (Go binary analysis)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .scanner-binaries
          scanners: vuln
          format: json
          output: security-reports/trivy-scanner-binaries-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Gate — the scanner binary on this job's PATH (pinned release digest, Go binary analysis present; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-scanner-binaries-vuln.json --name scanner-binaries
          --kind binary --artifact .scanner-binaries --binary-job frontend-quality --binary-pins security/scanner-binaries.json
          --binary-manifest security-reports/scanner-binaries-manifest.json

      - name: Gate — API venv (every installed distribution scanned, exactly the locks, vendored packages analysed; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed.json

      - name: Install the Playwright-pinned Chromium build
        run: npm run e2e:install --workspace apps/web 2>&1 | tee ci-logs/frontend-e2e-install.log

      - name: Browser customer flow against the built bundle (P6-CI-2)
        # e2e-browser.sh migrates a disposable database, starts the API and the worker,
        # waits on /health with a bounded loop, runs the Playwright suite against the
        # production bundle served by vite preview, gates on the JSON report (at least
        # one test, executed once, none skipped) and always stops every process.
        run: bash scripts/e2e-browser.sh 2>&1 | tee ci-logs/frontend-e2e.log

      # Real-scanner negative control for the installed-environment (rootfs) scans (this job runs its own Trivy and DB): an inert
      # dist-info (metadata only, no code) of a known-vulnerable PyYAML, with its inventory, must be found by Trivy rootfs and fail
      # the tooling gate.
      - name: Negative control — Trivy scans an inert installed environment carrying a known CRITICAL (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/tooling-env
          scanners: vuln
          format: json
          output: security-reports/control-tooling-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — the tooling gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-tooling-rootfs.json --name control-tooling-rootfs
          --kind tooling --artifact security/controls/tooling-env --env-root security/controls/tooling-env --min-lang-packages 1
          --installed-inventory security/controls/tooling-env-installed.json --expect-fail

      # Real-scanner negative control for the vendored-pin scan: an inert environment (metadata only, no code) whose pip
      # declares a known-vulnerable PyYAML in pip/_vendor/vendor.txt, and nowhere else, must be staged, found by the Trivy
      # filesystem scan and fail the tooling gate with a violation in its vendored-pin target.
      - name: Negative control — stage the vendored pins of an inert environment whose installer vendors a known CRITICAL
        if: always()
        run: python3 security/stage_inputs.py vendored --out .vendored-pins-control --env control security/controls/vendored-env security/controls/vendored-env-installed.json

      - name: Negative control — Trivy scans the inert environment (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/vendored-env
          scanners: vuln
          format: json
          output: security-reports/control-vendored-env-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — Trivy scans its staged vendored pins
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins-control
          scanners: vuln
          format: json
          output: security-reports/control-vendored-pins.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Negative control — the tooling gate must fail on the vendored copy
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vendored-env-rootfs.json --name control-vendored-pins
          --kind tooling --artifact security/controls/vendored-env --env-root security/controls/vendored-env --min-lang-packages 1
          --vendored-report security-reports/control-vendored-pins.json --vendored-artifact .vendored-pins-control --vendored-target control/requirements-vendored-pip.txt
          --installed-inventory security/controls/vendored-env-installed.json --expect-fail
          --expect-violation target=control/requirements-vendored-pip.txt

      - name: Negative control — the adopted vulnerability policy over this job's installed-environment reports
        if: always()
        run: python3 security/vuln_policy_controls.py check frontend security-reports

      - name: Inventory the API venv again, after every other step (a later install must fail)
        if: always()
        run: apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed-final.json

      - name: Gate — API venv, final inventory against the same scans
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv-final
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed-final.json

      - name: Every required installed-environment analysis of this job ran and was gated (completeness)
        if: always()
        run: >-
          python3 security/gate.py complete --name complete
          --expect-pass api-venv --expect-pass api-venv-final --expect-pass scanner-binaries
          --expect-control control-tooling-rootfs --expect-control control-vendored-pins
          --expect-control control-vulnpol-baseline-frontend-api-venv
          --expect-control control-vulnpol-critical-nofix-frontend-api-venv
          --expect-control control-vulnpol-critical-nofix-frontend-api-venv-vendored-pin
          --expect-control control-vulnpol-high-fix-frontend-api-venv
          --expect-control control-vulnpol-frontend-api-venv-package-not-scanned
          --expect-control control-vulnpol-frontend-api-venv-installed-after-scan
          --expect-control control-vulnpol-frontend-api-venv-installed-outside-the-locks
          --expect-control control-vulnpol-frontend-api-venv-version-differs-from-the-lock
          --expect-control control-vulnpol-frontend-api-venv-vendored-pin-not-scanned
          --expect-control control-vulnpol-frontend-api-venv-vendored-report-of-another-directory
          --expect-control control-vulnpol-frontend-api-venv-truncated-inventory
          --expect-control control-vulnpol-frontend-api-venv-project-not-from-the-checkout
          --expect-control control-vulnpol-frontend-api-venv-project-from-an-index-url
          --expect-control control-vulnpol-frontend-api-venv-project-from-outside-the-workspace
          --expect-control control-vulnpol-baseline-frontend-binaries
          --expect-control control-vulnpol-critical-nofix-frontend-binary-trivy
          --expect-control control-vulnpol-high-fix-frontend-binary-trivy
          --expect-control control-vulnpol-frontend-binary-trivy-analysis-missing
          --expect-control control-vulnpol-frontend-binary-trivy-stdlib-missing
          --expect-control control-vulnpol-frontend-binary-trivy-manifest-digest-differs

      - name: Upload frontend security reports and gate summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-frontend
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload frontend diagnostics
        # ci-logs/ now also carries the browser proof's API and worker logs and the
        # Playwright report, traces and screenshots retained on failure.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-logs
          path: ci-logs/
          retention-days: 7

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    # A disposable PostgreSQL service so the dialect-aware durable-job claim
    # (FOR UPDATE SKIP LOCKED) is exercised against a real database. The app under
    # test still runs in default local mode (SQLite) — only the opt-in, gated
    # integration test reads TEST_POSTGRES_URL and connects here directly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalnest
          POSTGRES_PASSWORD: signalnest
          POSTGRES_DB: signalnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalnest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Create fresh API virtualenv and install (dev extras)
        # P6-CI-6 coverage gaps (operator order 2026-10-20): pip and the setuptools build backend come from the
        # hash-locked apps/api/requirements-bootstrap.txt (the interpreter's bundled pip performs that one install and
        # is replaced by the locked pip) instead of an unpinned self-upgrade, and the editable install runs with
        # --no-build-isolation, so no unpinned build dependency is fetched; --only-binary :all: refuses a source build of any locked
        # dependency, whose build requirements pip would otherwise fetch unpinned and unhashed; --isolated ignores PIP_* variables and
        # user pip configuration, through which a constraint file could re-enable one. The venv is created with --clear,
        # so nothing an earlier step left there survives, and the last line makes it read-only, so no later step runs with it
        # writable; it is scanned as installed below.
        run: |
          mkdir -p ci-logs
          python -m venv --clear apps/api/.venv
          apps/api/.venv/bin/python -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r apps/api/requirements-bootstrap.txt 2>&1 | tee ci-logs/pip-install.log
          apps/api/.venv/bin/pip install --isolated --require-hashes --only-binary :all: -r apps/api/requirements-dev.txt 2>&1 | tee -a ci-logs/pip-install.log
          apps/api/.venv/bin/pip install --no-deps --no-build-isolation -e apps/api 2>&1 | tee -a ci-logs/pip-install.log
          python3 security/stage_inputs.py readonly apps/api/.venv

      - name: Lock reproducibility (linux/amd64)
        # P6-PLAT-4: the committed locks must be a valid resolution of pyproject.toml under the
        # documented toolchain on the deployment platform (linux/amd64, Python ${{ env.PYTHON_VERSION }}).
        # apps/api/tools/verify_locks.py re-resolves with the committed pins supplied to pip-tools
        # as its existing pins and recomputes every hash from the index (the pin list it hands
        # pip-tools carries no hashes, and --no-reuse-hashes is set), then fails on any pin or hash
        # difference: an incompatible, missing, unrequired or mis-hashed pin fails, a newer upstream
        # release alone does not (upgrades stay explicit, README-deps.md). Its regression tests
        # (offline, generated local wheels) run first. A separate tool venv keeps pip-tools out of
        # the application environment. CERT-2 (2026-10-21): pip 26.2.2 with pip-tools 7.6.2 (7.5.2 imports a
        # pip-internal symbol pip 26 removed and cannot run). Only the interpreter form (``<venv>/bin/python …``)
        # is used — the executable trust policy binds the interpreter, not bare ``pip``/``diff``
        # names. The locks are never rewritten here.
        # P6-CI-6 coverage gaps (operator order 2026-10-20): the tool venv is installed from the hash lock
        # apps/api/requirements-locktools.txt (pip, pip-tools and every transitive dependency, with --require-hashes
        # --no-deps). pip-tools reads the project's static metadata, so no build backend runs; verify_locks.py also
        # runs pip-compile with --no-build-isolation, so a backend that ever has to run is this lock's setuptools,
        # never an unpinned build-isolation fetch. .locktools is made read-only before the tools tests run, and it is scanned as
        # installed and reconciled against its lock below.
        run: |
          python -m venv --clear .locktools
          .locktools/bin/python -m pip install --isolated --quiet --require-hashes --only-binary :all: --no-deps -r apps/api/requirements-locktools.txt
          .locktools/bin/python -m pip check
          python3 security/stage_inputs.py readonly .locktools
          .locktools/bin/python -m pip --version
          .locktools/bin/python -m piptools compile --version
          cd apps/api
          ../../.locktools/bin/python -m unittest discover -s tools -p "test_*.py" -v
          ../../.locktools/bin/python tools/verify_locks.py

      - name: Locked environment integrity
        # The hash-checked install above is the only source of packages: verify the
        # resolved environment is consistent and that both entry points import.
        run: |
          apps/api/.venv/bin/python -m pip check
          apps/api/.venv/bin/python -c "import app.main, app.jobs.worker; print('app.main + app.jobs.worker import OK')"

      # P6-CI-6 coverage gaps (operator order 2026-10-20): the API venv this job installed is scanned AS INSTALLED,
      # reconciled against its own pip inspect inventory and against its hash locks (installed == the locks' pins plus
      # the editable project), and the packages its pip vendors without dist-info are analysed from a staged pin list.
      # The environment was made read-only at the end of its own install, so no later step ran with it writable, and both of
      # its gates require that, so an ordinary later install or uninstall fails its step instead of escaping both
      # inventories; the inventory is taken again at the end of the job, so an install that does land fails completeness.
      # The Trivy binary on the job's PATH is analysed and bound to its pinned release digest (security/scanner-binaries.json).
      - name: Inventory the API venv and the lock toolchain venv as installed and stage the packages their installers vendor
        if: always()
        run: |
          mkdir -p security-reports
          apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed.json
          .locktools/bin/python -m pip inspect > security-reports/locktools-installed.json
          python3 security/stage_inputs.py vendored --out .vendored-pins --env api-venv apps/api/.venv security-reports/api-venv-installed.json \
            --env locktools .locktools security-reports/locktools-installed.json

      - name: Trivy — API venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: apps/api/.venv
          scanners: vuln
          format: json
          output: security-reports/trivy-api-venv-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — lock toolchain venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .locktools
          scanners: vuln
          format: json
          output: security-reports/trivy-locktools-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — packages vendored inside the installed environments (staged pin lists)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins
          scanners: vuln
          format: json
          output: security-reports/trivy-vendored-pins-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Stage the scanner binary on this job's PATH
        if: always()
        run: python3 security/stage_inputs.py binaries --pins security/scanner-binaries.json --job backend-quality --out .scanner-binaries --manifest security-reports/scanner-binaries-manifest.json

      - name: Trivy — the scanner binary on this job's PATH (Go binary analysis)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .scanner-binaries
          scanners: vuln
          format: json
          output: security-reports/trivy-scanner-binaries-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Gate — the scanner binary on this job's PATH (pinned release digest, Go binary analysis present; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-scanner-binaries-vuln.json --name scanner-binaries
          --kind binary --artifact .scanner-binaries --binary-job backend-quality --binary-pins security/scanner-binaries.json
          --binary-manifest security-reports/scanner-binaries-manifest.json

      - name: Gate — API venv (every installed distribution scanned, exactly the locks, vendored packages analysed; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed.json

      - name: Gate — lock toolchain venv (every installed distribution scanned, exactly the lock, vendored packages analysed; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-locktools-vuln.json --name locktools
          --kind tooling --artifact .locktools --env-root .locktools --min-lang-packages 7
          --locked-by apps/api/requirements-locktools.txt
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target locktools/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/locktools-installed.json

      - name: Ruff check
        run: apps/api/.venv/bin/python -m ruff check apps/api 2>&1 | tee ci-logs/backend-ruff.log

      - name: Backend tests
        # Invoke the repo bash scripts directly (they use apps/api/.venv); this
        # job sets up Python only, so it must not depend on npm/Node.
        # A migrated + seeded DB is required for the HTTP-isolation integration tests.
        # TEST_POSTGRES_URL points the opt-in, gated cross-worker claim test at the
        # disposable postgres service above; every other test stays on local SQLite.
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://signalnest:signalnest@localhost:5432/signalnest_test
        run: |
          bash scripts/demo-setup.sh 2>&1 | tee ci-logs/backend-demo-setup.log
          # P6-CI-8: measure and REPORT coverage; this is not a gate (no --cov-fail-under).
          bash scripts/run-tests-api.sh --cov=app --cov-branch --cov-report=term --cov-report=xml:../../ci-logs/coverage-api.xml 2>&1 | tee ci-logs/backend-pytest.log
          { echo '### API coverage (report only, no threshold)'; grep -E '^TOTAL' ci-logs/backend-pytest.log || echo 'coverage total not found'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API coverage report (P6-CI-8, report only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: ci-logs/coverage-api.xml
          retention-days: 30
          if-no-files-found: warn

      - name: PostgreSQL proofs (P6-CI-4 migration chain, P6-CI-5 job-store concurrency)
        # The PostgreSQL proof modules (migration chain, job-store concurrency, LLM budget accounting)
        # run again on their own, as a REQUIRED result
        # of this check: against the disposable service above, each test in a database
        # of its own (created and dropped per test; never the shared one). With
        # TEST_POSTGRES_URL unset they FAIL here (CI=true), never skip; an unreachable
        # database fails them; and the summary is inspected so a skipped test can never
        # pass this step silently. The modules are named by dotted module path (--pyargs)
        # on purpose: the governance coherence check resolves every path-shaped token in
        # this workflow against the repository root, where a working-directory-relative
        # file path would not resolve.
        working-directory: apps/api
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://signalnest:signalnest@localhost:5432/signalnest_test
          CI: "true"
        run: |
          .venv/bin/python -m pytest --pyargs \
            app.tests.test_postgres_migration_proof \
            app.tests.test_postgres_job_store_concurrency \
            app.tests.test_postgres_llm_accounting \
            -q -rsxX -p no:cacheprovider 2>&1 | tee ../../ci-logs/backend-postgres-proofs.log
          echo "== no PostgreSQL proof may be skipped or xfailed =="
          if grep -Eiq "skipped|xfail|xpass" ../../ci-logs/backend-postgres-proofs.log; then
            echo "a PostgreSQL proof was skipped or expected to fail; the proof is not established" >&2
            exit 1
          fi
          grep -E "^[0-9]+ passed" ../../ci-logs/backend-postgres-proofs.log

      # Real-scanner negative control for the installed-environment (rootfs) scans (this job runs its own Trivy and DB): an inert
      # dist-info (metadata only, no code) of a known-vulnerable PyYAML, with its inventory, must be found by Trivy rootfs and fail
      # the tooling gate.
      - name: Negative control — Trivy scans an inert installed environment carrying a known CRITICAL (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/tooling-env
          scanners: vuln
          format: json
          output: security-reports/control-tooling-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — the tooling gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-tooling-rootfs.json --name control-tooling-rootfs
          --kind tooling --artifact security/controls/tooling-env --env-root security/controls/tooling-env --min-lang-packages 1
          --installed-inventory security/controls/tooling-env-installed.json --expect-fail

      # Real-scanner negative control for the vendored-pin scan: an inert environment (metadata only, no code) whose pip
      # declares a known-vulnerable PyYAML in pip/_vendor/vendor.txt, and nowhere else, must be staged, found by the Trivy
      # filesystem scan and fail the tooling gate with a violation in its vendored-pin target.
      - name: Negative control — stage the vendored pins of an inert environment whose installer vendors a known CRITICAL
        if: always()
        run: python3 security/stage_inputs.py vendored --out .vendored-pins-control --env control security/controls/vendored-env security/controls/vendored-env-installed.json

      - name: Negative control — Trivy scans the inert environment (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/vendored-env
          scanners: vuln
          format: json
          output: security-reports/control-vendored-env-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — Trivy scans its staged vendored pins
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins-control
          scanners: vuln
          format: json
          output: security-reports/control-vendored-pins.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Negative control — the tooling gate must fail on the vendored copy
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vendored-env-rootfs.json --name control-vendored-pins
          --kind tooling --artifact security/controls/vendored-env --env-root security/controls/vendored-env --min-lang-packages 1
          --vendored-report security-reports/control-vendored-pins.json --vendored-artifact .vendored-pins-control --vendored-target control/requirements-vendored-pip.txt
          --installed-inventory security/controls/vendored-env-installed.json --expect-fail
          --expect-violation target=control/requirements-vendored-pip.txt

      - name: Negative control — the adopted vulnerability policy over this job's installed-environment reports
        if: always()
        run: python3 security/vuln_policy_controls.py check backend security-reports

      - name: Inventory the API venv again, after every other step (a later install must fail)
        if: always()
        run: |
          apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed-final.json
          .locktools/bin/python -m pip inspect > security-reports/locktools-installed-final.json

      - name: Gate — API venv, final inventory against the same scans
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv-final
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed-final.json

      - name: Gate — lock toolchain venv, final inventory against the same scans
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-locktools-vuln.json --name locktools-final
          --kind tooling --artifact .locktools --env-root .locktools --min-lang-packages 7
          --locked-by apps/api/requirements-locktools.txt
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target locktools/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/locktools-installed-final.json

      - name: Every required installed-environment analysis of this job ran and was gated (completeness)
        if: always()
        run: >-
          python3 security/gate.py complete --name complete
          --expect-pass api-venv --expect-pass api-venv-final --expect-pass locktools --expect-pass locktools-final --expect-pass scanner-binaries
          --expect-control control-tooling-rootfs --expect-control control-vendored-pins
          --expect-control control-vulnpol-baseline-backend-api-venv
          --expect-control control-vulnpol-critical-nofix-backend-api-venv
          --expect-control control-vulnpol-critical-nofix-backend-api-venv-vendored-pin
          --expect-control control-vulnpol-high-fix-backend-api-venv
          --expect-control control-vulnpol-backend-api-venv-package-not-scanned
          --expect-control control-vulnpol-backend-api-venv-installed-after-scan
          --expect-control control-vulnpol-backend-api-venv-installed-outside-the-locks
          --expect-control control-vulnpol-backend-api-venv-version-differs-from-the-lock
          --expect-control control-vulnpol-backend-api-venv-vendored-pin-not-scanned
          --expect-control control-vulnpol-backend-api-venv-vendored-report-of-another-directory
          --expect-control control-vulnpol-backend-api-venv-truncated-inventory
          --expect-control control-vulnpol-backend-api-venv-project-not-from-the-checkout
          --expect-control control-vulnpol-backend-api-venv-project-from-an-index-url
          --expect-control control-vulnpol-backend-api-venv-project-from-outside-the-workspace
          --expect-control control-vulnpol-baseline-backend-binaries
          --expect-control control-vulnpol-critical-nofix-backend-binary-trivy
          --expect-control control-vulnpol-high-fix-backend-binary-trivy
          --expect-control control-vulnpol-backend-binary-trivy-analysis-missing
          --expect-control control-vulnpol-backend-binary-trivy-stdlib-missing
          --expect-control control-vulnpol-backend-binary-trivy-manifest-digest-differs
          --expect-control control-vulnpol-baseline-backend-locktools
          --expect-control control-vulnpol-critical-nofix-backend-locktools
          --expect-control control-vulnpol-critical-nofix-backend-locktools-vendored-pin
          --expect-control control-vulnpol-high-fix-backend-locktools
          --expect-control control-vulnpol-backend-locktools-package-not-scanned
          --expect-control control-vulnpol-backend-locktools-installed-after-scan
          --expect-control control-vulnpol-backend-locktools-installed-outside-the-locks
          --expect-control control-vulnpol-backend-locktools-version-differs-from-the-lock
          --expect-control control-vulnpol-backend-locktools-vendored-pin-not-scanned
          --expect-control control-vulnpol-backend-locktools-vendored-report-of-another-directory
          --expect-control control-vulnpol-backend-locktools-truncated-inventory

      - name: Upload backend security reports and gate summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-backend
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: ci-logs/
          retention-days: 7

  migration-and-contract:
    name: Migrations and API contract
    runs-on: ubuntu-latest
    # A disposable PostgreSQL 16 service (the same pattern as Backend quality) so the
    # migration round-trip below also runs on the production dialect (P6-CI-4). The
    # SQLite steps are kept unchanged; the seed steps stay SQLite-only by design —
    # app.db.seed refuses every non-SQLite target.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalnest
          POSTGRES_PASSWORD: signalnest
          POSTGRES_DB: signalnest_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalnest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        # P6-CI-6 coverage gaps (operator order 2026-10-20): pip and the setuptools build backend come from the
        # hash-locked apps/api/requirements-bootstrap.txt (the interpreter's bundled pip performs that one install and
        # is replaced by the locked pip) instead of an unpinned self-upgrade, and the editable install runs with
        # --no-build-isolation, so no unpinned build dependency is fetched; --only-binary :all: refuses a source build of any locked
        # dependency, whose build requirements pip would otherwise fetch unpinned and unhashed; --isolated ignores PIP_* variables and
        # user pip configuration, through which a constraint file could re-enable one. The venv is created with --clear,
        # so nothing an earlier step left there survives, and the last line makes it read-only, so no later step runs with it
        # writable; it is scanned as installed below.
        run: |
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm-ci.log
          python -m venv --clear apps/api/.venv
          apps/api/.venv/bin/python -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r apps/api/requirements-bootstrap.txt 2>&1 | tee ci-logs/pip-install.log
          apps/api/.venv/bin/pip install --isolated --require-hashes --only-binary :all: -r apps/api/requirements-dev.txt 2>&1 | tee -a ci-logs/pip-install.log
          apps/api/.venv/bin/pip install --no-deps --no-build-isolation -e apps/api 2>&1 | tee -a ci-logs/pip-install.log
          python3 security/stage_inputs.py readonly apps/api/.venv

      - name: Migration round-trip + seed idempotency
        working-directory: apps/api
        run: |
          PY=.venv/bin/python
          echo "== fresh database: remove any pre-existing SQLite file =="
          rm -f signalnest.db
          echo "== upgrade empty database -> head =="
          $PY -m alembic upgrade head
          echo "== schema-drift check (expect: no new upgrade operations) =="
          $PY -m alembic check
          echo "== seed =="
          $PY -m app.db.seed
          echo "== seed again (idempotency: no duplicates, safe re-run) =="
          $PY -m app.db.seed
          echo "== downgrade to base (real, under the target-bound guard) =="
          $PY -m alembic -x confirm=$($PY -m app.db.migrate downgrade-confirmation base) downgrade base
          echo "== upgrade back to head =="
          $PY -m alembic upgrade head
          echo "== reset + reseed (documented seed:reset workflow) =="
          $PY -m app.db.seed --reset

      # P6-CI-6 coverage gaps (operator order 2026-10-20): the API venv this job installed is scanned AS INSTALLED,
      # reconciled against its own pip inspect inventory and against its hash locks (installed == the locks' pins plus
      # the editable project), and the packages its pip vendors without dist-info are analysed from a staged pin list.
      # The environment was made read-only at the end of its own install, so no later step ran with it writable, and both of
      # its gates require that, so an ordinary later install or uninstall fails its step instead of escaping both
      # inventories; the inventory is taken again at the end of the job, so an install that does land fails completeness.
      # The Trivy binary on the job's PATH is analysed and bound to its pinned release digest (security/scanner-binaries.json).
      - name: Inventory the API venv as installed and stage the packages its installer vendors
        if: always()
        run: |
          mkdir -p security-reports
          apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed.json
          python3 security/stage_inputs.py vendored --out .vendored-pins --env api-venv apps/api/.venv security-reports/api-venv-installed.json

      - name: Trivy — API venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: apps/api/.venv
          scanners: vuln
          format: json
          output: security-reports/trivy-api-venv-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — packages vendored inside the installed environments (staged pin lists)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins
          scanners: vuln
          format: json
          output: security-reports/trivy-vendored-pins-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Stage the scanner binary on this job's PATH
        if: always()
        run: python3 security/stage_inputs.py binaries --pins security/scanner-binaries.json --job migration-and-contract --out .scanner-binaries --manifest security-reports/scanner-binaries-manifest.json

      - name: Trivy — the scanner binary on this job's PATH (Go binary analysis)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .scanner-binaries
          scanners: vuln
          format: json
          output: security-reports/trivy-scanner-binaries-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Gate — the scanner binary on this job's PATH (pinned release digest, Go binary analysis present; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-scanner-binaries-vuln.json --name scanner-binaries
          --kind binary --artifact .scanner-binaries --binary-job migration-and-contract --binary-pins security/scanner-binaries.json
          --binary-manifest security-reports/scanner-binaries-manifest.json

      - name: Gate — API venv (every installed distribution scanned, exactly the locks, vendored packages analysed; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed.json

      - name: Migration round-trip on PostgreSQL 16 (P6-CI-4)
        # The same chain the SQLite step drives, on the production dialect, against the
        # empty disposable database above: empty -> head, the schema-drift check, a real
        # downgrade to base under the target-bound confirmation guard (the token is
        # minted for THIS database and transition), and the upgrade back to head. The
        # revision is read back after each phase so a silent no-op cannot pass. No seed:
        # app.db.seed refuses PostgreSQL by design (proven by the pytest module above).
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://signalnest:signalnest@localhost:5432/signalnest_migrate
        # Literal interpreter words (never a $PY variable): the executable-trust inventory
        # must resolve every command position of this step without a dynamic-site declaration.
        run: |
          echo "== upgrade empty PostgreSQL database -> head =="
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python -m alembic current 2>/dev/null | tee ../../ci-logs/pg-revision-after-upgrade.txt
          grep -q "(head)" ../../ci-logs/pg-revision-after-upgrade.txt
          echo "== schema-drift check on PostgreSQL (expect: no new upgrade operations) =="
          .venv/bin/python -m alembic check
          echo "== downgrade to base (real, under the target-bound guard) =="
          .venv/bin/python -m alembic -x confirm=$(.venv/bin/python -m app.db.migrate downgrade-confirmation base) downgrade base
          .venv/bin/python -m alembic current 2>/dev/null | tee ../../ci-logs/pg-revision-after-downgrade.txt
          if grep -q "(head)" ../../ci-logs/pg-revision-after-downgrade.txt; then
            echo "downgrade to base did not move the PostgreSQL revision" >&2
            exit 1
          fi
          echo "== upgrade back to head =="
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python -m alembic current 2>/dev/null | tee ../../ci-logs/pg-revision-after-reupgrade.txt
          grep -q "(head)" ../../ci-logs/pg-revision-after-reupgrade.txt
          .venv/bin/python -m alembic check

      - name: OpenAPI regeneration + contract-drift check
        run: |
          npm run gen:types 2>&1 | tee ci-logs/gen-types.log
          echo "== fail if generation produced an uncommitted diff =="
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts

      - name: Show contract drift on failure
        if: failure()
        run: git --no-pager diff -- apps/api/openapi.json apps/web/src/api/schema.d.ts || true

      # Real-scanner negative control for the installed-environment (rootfs) scans (this job runs its own Trivy and DB): an inert
      # dist-info (metadata only, no code) of a known-vulnerable PyYAML, with its inventory, must be found by Trivy rootfs and fail
      # the tooling gate.
      - name: Negative control — Trivy scans an inert installed environment carrying a known CRITICAL (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/tooling-env
          scanners: vuln
          format: json
          output: security-reports/control-tooling-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — the tooling gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-tooling-rootfs.json --name control-tooling-rootfs
          --kind tooling --artifact security/controls/tooling-env --env-root security/controls/tooling-env --min-lang-packages 1
          --installed-inventory security/controls/tooling-env-installed.json --expect-fail

      # Real-scanner negative control for the vendored-pin scan: an inert environment (metadata only, no code) whose pip
      # declares a known-vulnerable PyYAML in pip/_vendor/vendor.txt, and nowhere else, must be staged, found by the Trivy
      # filesystem scan and fail the tooling gate with a violation in its vendored-pin target.
      - name: Negative control — stage the vendored pins of an inert environment whose installer vendors a known CRITICAL
        if: always()
        run: python3 security/stage_inputs.py vendored --out .vendored-pins-control --env control security/controls/vendored-env security/controls/vendored-env-installed.json

      - name: Negative control — Trivy scans the inert environment (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/vendored-env
          scanners: vuln
          format: json
          output: security-reports/control-vendored-env-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — Trivy scans its staged vendored pins
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins-control
          scanners: vuln
          format: json
          output: security-reports/control-vendored-pins.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Negative control — the tooling gate must fail on the vendored copy
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vendored-env-rootfs.json --name control-vendored-pins
          --kind tooling --artifact security/controls/vendored-env --env-root security/controls/vendored-env --min-lang-packages 1
          --vendored-report security-reports/control-vendored-pins.json --vendored-artifact .vendored-pins-control --vendored-target control/requirements-vendored-pip.txt
          --installed-inventory security/controls/vendored-env-installed.json --expect-fail
          --expect-violation target=control/requirements-vendored-pip.txt

      - name: Negative control — the adopted vulnerability policy over this job's installed-environment reports
        if: always()
        run: python3 security/vuln_policy_controls.py check migrations security-reports

      - name: Inventory the API venv again, after every other step (a later install must fail)
        if: always()
        run: apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed-final.json

      - name: Gate — API venv, final inventory against the same scans
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv-final
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed-final.json

      - name: Every required installed-environment analysis of this job ran and was gated (completeness)
        if: always()
        run: >-
          python3 security/gate.py complete --name complete
          --expect-pass api-venv --expect-pass api-venv-final --expect-pass scanner-binaries
          --expect-control control-tooling-rootfs --expect-control control-vendored-pins
          --expect-control control-vulnpol-baseline-migrations-api-venv
          --expect-control control-vulnpol-critical-nofix-migrations-api-venv
          --expect-control control-vulnpol-critical-nofix-migrations-api-venv-vendored-pin
          --expect-control control-vulnpol-high-fix-migrations-api-venv
          --expect-control control-vulnpol-migrations-api-venv-package-not-scanned
          --expect-control control-vulnpol-migrations-api-venv-installed-after-scan
          --expect-control control-vulnpol-migrations-api-venv-installed-outside-the-locks
          --expect-control control-vulnpol-migrations-api-venv-version-differs-from-the-lock
          --expect-control control-vulnpol-migrations-api-venv-vendored-pin-not-scanned
          --expect-control control-vulnpol-migrations-api-venv-vendored-report-of-another-directory
          --expect-control control-vulnpol-migrations-api-venv-truncated-inventory
          --expect-control control-vulnpol-migrations-api-venv-project-not-from-the-checkout
          --expect-control control-vulnpol-migrations-api-venv-project-from-an-index-url
          --expect-control control-vulnpol-migrations-api-venv-project-from-outside-the-workspace
          --expect-control control-vulnpol-baseline-migrations-binaries
          --expect-control control-vulnpol-critical-nofix-migrations-binary-trivy
          --expect-control control-vulnpol-high-fix-migrations-binary-trivy
          --expect-control control-vulnpol-migrations-binary-trivy-analysis-missing
          --expect-control control-vulnpol-migrations-binary-trivy-stdlib-missing
          --expect-control control-vulnpol-migrations-binary-trivy-manifest-digest-differs

      - name: Upload migration and contract security reports and gate summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-migrations
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload migration/contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migration-contract-logs
          path: ci-logs/
          retention-days: 7

  container-build:
    name: Container build and security
    runs-on: ubuntu-latest
    # Batch 4: build the production API + worker images, prove they are non-root
    # and secret-free, and exercise the migration actor + entrypoints end-to-end.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: api
          tags: signalnest-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: worker
          tags: signalnest-worker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security check — non-root, no secrets (API)
        run: bash scripts/docker-security-check.sh signalnest-api:ci

      - name: Security check — non-root, no secrets (worker)
        run: bash scripts/docker-security-check.sh signalnest-worker:ci

      - name: API image imports cleanly
        run: docker run --rm --entrypoint python signalnest-api:ci -c "import app.main; print('api import ok')"

      - name: Migration actor + schema-compat check run in the image
        # Point the DB at writable /tmp (the image is read-only-root compatible;
        # only /tmp is writable). Upgrade a fresh SQLite DB to head, then verify
        # the startup schema-compatibility check reports compatible (exit 0).
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/ci.db --entrypoint sh signalnest-worker:ci -c '
            python -m app.db.migrate upgrade &&
            python -m app.db.migrate check
          '

      - name: Worker refuses an un-migrated database (schema gate)
        # A fresh, empty database is "uninitialized"; the compatibility check must
        # exit non-zero rather than silently running or migrating.
        run: |
          if docker run --rm -e DATABASE_URL=sqlite:////tmp/empty.db --entrypoint python signalnest-worker:ci -m app.db.migrate check; then
            echo "FAIL: check unexpectedly passed on an uninitialized database" >&2
            exit 1
          fi
          echo "ok: schema gate correctly rejects an uninitialized database"

      - name: Bare migration actor command + revision tools (exact ECS shape, fail-closed)
        # ECS runs the migration actor with command = ["python","-m","app.db.migrate"]
        # — NO subcommand (infra/aws/modules/ecs/main.tf). The steps above only
        # exercise the explicit `upgrade`/`check` subcommands, which dispatch to a
        # DIFFERENT function; this step executes the real bare command end to end
        # (upgrade + read-back verification), plus the raw revision reader and the
        # offline comparator, against controlled SQLite state with no network.
        # Positive event output, distinct failure classifications, and no
        # secret-bearing output are all asserted.
        run: |
          docker run --rm --network none -e LOG_FORMAT=json --entrypoint sh signalnest-worker:ci -c '
            set -eu
            export DATABASE_URL=sqlite:////tmp/bare.db

            echo "== (1) bare command, fresh DB: exit 0 + verification event =="
            python -m app.db.migrate > /tmp/out1.json 2> /tmp/err1.log
            grep -q "\"event\": \"migrate.upgrade_verify.done\"" /tmp/out1.json
            grep -q "\"code_head\"" /tmp/out1.json
            grep -q "\"db_revision\"" /tmp/out1.json
            test ! -s /tmp/err1.log
            ! grep -q "Traceback" /tmp/out1.json

            echo "== (2) bare command, corrupted version table: exit 4 + fixed classification =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27aaaaaaaaaaaa\x27)\"); c.commit()"
            rc=0; python -m app.db.migrate > /tmp/out2.json 2> /tmp/err2.log || rc=$?
            test "$rc" -eq 4
            grep -q "\"event\": \"migrate.upgrade.failed\"" /tmp/out2.json
            grep -q "\"error_class\"" /tmp/out2.json
            ! grep -q "Traceback" /tmp/out2.json
            ! grep -q "Traceback" /tmp/err2.log

            echo "== (3) revision tools import cleanly =="
            python -c "import app.db.revision_status, app.db.revision_compare; print(\"revision tools import ok\")"

            echo "== (4) reader: one valid row -> exactly one revision line; matches comparator =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version WHERE version_num=\x27aaaaaaaaaaaa\x27\"); c.commit()"
            rev=$(python -m app.db.revision_status)
            echo "$rev" | grep -Eq "^[0-9a-f]{12}$"
            python -m app.db.revision_status | python -m app.db.revision_compare

            echo "== (5) reader: stray argv rejected (30) =="
            rc=0; python -m app.db.revision_status extra >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 30

            echo "== (6) reader: zero rows (33) =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version\"); c.commit()"
            rc=0; python -m app.db.revision_status >/dev/null 2>/tmp/err33 || rc=$?
            test "$rc" -eq 33 && grep -q "no-revision-rows" /tmp/err33

            echo "== (7) reader: multiple rows (34) =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.executemany(\"INSERT INTO alembic_version VALUES (?)\", [(\"aaaaaaaaaaaa\",),(\"bbbbbbbbbbbb\",)]); c.commit()"
            rc=0; python -m app.db.revision_status >/dev/null 2>/tmp/err34 || rc=$?
            test "$rc" -eq 34 && grep -q "multiple-revision-rows" /tmp/err34

            echo "== (8) reader: malformed revision (35) =="
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27NOTAREVISION\x27)\"); c.commit()"
            rc=0; python -m app.db.revision_status >/dev/null 2>/tmp/err35 || rc=$?
            test "$rc" -eq 35 && grep -q "malformed-revision" /tmp/err35

            echo "== (9) reader: version table missing (32) =="
            python -c "import sqlite3; sqlite3.connect(\"/tmp/fresh.db\").close()"
            rc=0; DATABASE_URL=sqlite:////tmp/fresh.db python -m app.db.revision_status >/dev/null 2>/tmp/err32 || rc=$?
            test "$rc" -eq 32 && grep -q "version-table-missing" /tmp/err32

            echo "== (10) comparator: mismatch (43), multi-line (41), empty (41) =="
            rc=0; printf "aaaaaaaaaaaa\n" | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 43
            rc=0; printf "aaaaaaaaaaaa\nbbbbbbbbbbbb\n" | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 41
            rc=0; printf "" | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 41

            echo "== (10b) end-to-end provenance: DB at a NON-head revision -> reader|comparator must MISMATCH (43) =="
            # A reader that prints the code head instead of the database value
            # would make the pipe above tautological; this closes it.
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare.db\"); c.execute(\"DELETE FROM alembic_version\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27aaaaaaaaaaaa\x27)\"); c.commit()"
            rc=0; python -m app.db.revision_status | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 43

            echo "== (11) no secret-bearing output: the database URL never appears =="
            ! grep -q "sqlite:" /tmp/out1.json
            ! grep -q "sqlite:" /tmp/out2.json

            echo "bare-command + revision-tools in-image verification: PASS"
          '

      # --- Merge-path security scanning and SBOMs (P6-CI-6) -----------------------------
      # Every scanner below writes a machine-readable report into security-reports/ and is
      # asked NOT to exit on findings; security/gate.py then (1) validates that the report is
      # the scanner's document shape, (2) proves it describes THIS job's artifact over a
      # non-empty population, (3) evaluates the findings against security/policy.json, whose
      # thresholds were ADOPTED for the merge path by the operator order of 2026-10-19, and (4) exits with a
      # distinct code: 3 policy violation, 4 analysis incomplete, 2 report missing/malformed.
      # A scanner crash fails its own step; the gate after it then reports a missing report.
      # Gate steps run `if: always()` so one failing gate does not hide the others' verdicts;
      # each still fails the job on its own. Negative controls scan security/controls/ with
      # the same tools and rules and MUST be detected. Coverage, exclusions and the proposed
      # policy are documented in security/README.md.
      - name: Security gate self-tests (inert synthetic reports); create the reports directory
        # The scanners below write into security-reports/ and refuse to run when it is absent
        # (CI run 1 of this change: "failed to create output file ... no such file or
        # directory"), so it is created here, before the first scanner, by a step of its own.
        run: |
          python3 -m unittest discover -s security -p "test_*.py"
          mkdir -p security-reports

      # Every Trivy step passes a reviewed configuration (security/trivy.yaml, security/controls/trivy-control.yaml
      # or security/trivy-scan.yaml), each pinning the tracked, empty security/empty-ignorefile, so Trivy reads no ignore
      # or configuration file from the working directory, whenever one appears (P6-CI-6 closure).
      - name: Trivy — dependency vulnerabilities in the committed locks
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: security-reports/trivy-locks-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          skip-dirs: security/controls
          trivy-config: security/trivy.yaml

      - name: Trivy — API image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: signalnest-api:ci
          scanners: vuln
          format: json
          output: security-reports/trivy-image-api-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — worker image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: signalnest-worker:ci
          scanners: vuln
          format: json
          output: security-reports/trivy-image-worker-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — API image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: signalnest-api:ci
          format: cyclonedx
          output: security-reports/sbom-image-api.cdx.json
          exit-code: '0'
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — worker image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: signalnest-worker:ci
          format: cyclonedx
          output: security-reports/sbom-image-worker.cdx.json
          exit-code: '0'
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — repository dependency SBOM (CycloneDX, committed locks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: security-reports/sbom-locks.cdx.json
          exit-code: '0'
          skip-dirs: security/controls
          trivy-config: security/trivy.yaml

      - name: Trivy — infrastructure and container configuration (IaC misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: .
          format: json
          output: security-reports/trivy-config.json
          exit-code: '0'
          skip-dirs: security/controls
          trivy-config: security/trivy-scan.yaml

      - name: Set up Python (security tooling)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: security/requirements-semgrep.txt

      - name: Create the security tooling virtualenv (Semgrep, hash-locked)
        run: |
          python3 -m venv --clear .security-venv
          .security-venv/bin/python -m pip install --isolated --quiet --require-hashes --only-binary :all: -r security/requirements-semgrep.txt
          .security-venv/bin/semgrep --version

      - name: Fetch and validate the Semgrep rulesets (provenance recorded)
        # The fetcher's own tests run first, under this hash-locked venv (it carries the
        # safe YAML parser); the registry serves rulesets as YAML or JSON, and a partial
        # population is never left behind for the steps below. The timeout bounds a ruleset
        # that would otherwise hold the runner until the six-hour job limit.
        timeout-minutes: 10
        run: |
          .security-venv/bin/python -m unittest discover -s security -p "fetcher_selftest.py"
          .security-venv/bin/python security/fetch_semgrep_rules.py .security-venv/semgrep-rules security-reports/semgrep-rules-provenance.json
          .security-venv/bin/semgrep --validate --metrics=off --config .security-venv/semgrep-rules

      - name: Semgrep — static application security analysis (Python, TypeScript)
        run: >-
          .security-venv/bin/semgrep scan --metrics=off --no-rewrite-rule-ids
          --timeout 60 --timeout-threshold 0 --exclude security/controls
          --config .security-venv/semgrep-rules --json --output security-reports/semgrep.json
          apps scripts security

      - name: Gate — lock vulnerabilities (CRITICAL in every scope; HIGH with a fix in runtime scope; development HIGH reported)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-locks-vuln.json --name locks-vuln
          --kind filesystem --artifact .
          --expect-target package-lock.json
          --expect-target apps/api/requirements-runtime.txt
          --expect-target apps/api/requirements-dev.txt
          --expect-target apps/api/requirements-bootstrap.txt
          --expect-target apps/api/requirements-locktools.txt
          --expect-target scripts/requirements-gate.txt
          --expect-target scripts/requirements-gate-hashes.txt
          --expect-target security/requirements-semgrep.txt
          --expect-target apps/revision-reader/requirements-dev.txt
          --expect-target apps/revision-reader/requirements-toolcache-pip.txt

      - name: Gate — API image vulnerabilities (OS packages and the locked Python set)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-image-api-vuln.json --name image-api-vuln
          --kind image --artifact signalnest-api:ci --min-lang-packages 40

      - name: Gate — worker image vulnerabilities (OS packages and the locked Python set)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-image-worker-vuln.json --name image-worker-vuln
          --kind image --artifact signalnest-worker:ci --min-lang-packages 40

      - name: Gate — API image SBOM identity and population
        if: always()
        run: >-
          python3 security/gate.py sbom security-reports/sbom-image-api.cdx.json --name sbom-image-api
          --kind image --artifact signalnest-api:ci --min-components 100 --commit "${{ github.event.pull_request.head.sha || github.sha }}" --checkout "${{ github.sha }}"
          --image-id-from security-reports/trivy-image-api-vuln.json
          --identity-out security-reports/sbom-image-api.identity.json

      - name: Gate — worker image SBOM identity and population
        if: always()
        run: >-
          python3 security/gate.py sbom security-reports/sbom-image-worker.cdx.json --name sbom-image-worker
          --kind image --artifact signalnest-worker:ci --min-components 100 --commit "${{ github.event.pull_request.head.sha || github.sha }}" --checkout "${{ github.sha }}"
          --image-id-from security-reports/trivy-image-worker-vuln.json
          --identity-out security-reports/sbom-image-worker.identity.json

      - name: Gate — repository SBOM population
        if: always()
        run: >-
          python3 security/gate.py sbom security-reports/sbom-locks.cdx.json --name sbom-locks
          --kind filesystem --artifact . --min-components 500 --commit "${{ github.event.pull_request.head.sha || github.sha }}" --checkout "${{ github.sha }}"
          --identity-out security-reports/sbom-locks.identity.json

      # The reviewed exceptions file (adopted by operator order of 2026-10-18) excepts exactly the
      # six class A/B/C findings it names, each by check, file, enclosing resource block, instance
      # count, literal conditions and expiry; an excepted finding is still listed, and an expired,
      # stale, miscounted or condition-failing entry fails this step (security/README.md).
      - name: Gate — IaC misconfigurations
        if: always()
        run: >-
          python3 security/gate.py misconfig security-reports/trivy-config.json --name iac
          --expect-type dockerfile --expect-type terraform
          --exceptions security/misconfig-exceptions.json --source-root .

      - name: Gate — SAST
        if: always()
        run: >-
          python3 security/gate.py sast security-reports/semgrep.json --name sast
          --expect-prefix apps/api/app --expect-prefix apps/web/src
          --expect-prefix apps/revision-reader/revision_reader --expect-prefix scripts
          --expect-prefix security --expect-extension .py --expect-extension .tsx

      # Negative controls: each required analysis category must still DETECT an intended,
      # inert finding; the gate is run with --expect-fail and passes ONLY on a policy
      # violation, so a clean result, a crash or an empty report fails the control.
      - name: Negative control — Trivy scans an inert lock carrying a known CRITICAL
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: security/controls/vuln
          scanners: vuln
          format: json
          output: security-reports/control-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/controls/trivy-control.yaml

      - name: Negative control — the lock gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vuln.json --name control-vuln
          --kind filesystem --artifact security/controls/vuln --expect-target pinned-vulnerable.txt --expect-fail
          --control-target-scope pinned-vulnerable.txt=runtime

      - name: Negative control — Trivy scans an inert module with an open security-group rule
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: security/controls/iac
          format: json
          output: security-reports/control-iac.json
          exit-code: '0'
          trivy-config: security/trivy-scan.yaml

      # With the exceptions file loaded, the inert finding must STILL be a violation: no entry may
      # except it (the entries are also stale against this fixture, so the control names the check).
      - name: Negative control — the IaC gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py misconfig security-reports/control-iac.json --name control-iac
          --expect-type terraform --exceptions security/misconfig-exceptions.json
          --source-root security/controls/iac --expect-fail --expect-violation AWS-0107

      # IaC exception controls: each case is a copy of the checked-out tree with ONE mutation that
      # must defeat an exception (a widened, IPv6, overridden or shadowed egress rule; a fourth
      # workload; an expired or stale entry; an HTTP listener in the alb module, a new module file,
      # the root module or under the alias type; a non-literal protocol; a non-local module source,
      # or a local one that resolves outside infra/aws, directly or through a symlink;
      # a .tofu file; a provisioner; a non-SSE-S3 log bucket), plus an unmutated baseline that must
      # PASS. One real Trivy scan covers every case; the real gate then runs once per case and must
      # report the case's own violation token (security/iac_exception_controls.py).
      - name: Negative control — build the IaC exception mutation cases
        if: always()
        run: python3 security/iac_exception_controls.py build security-reports/iac-exception-controls

      - name: Negative control — Trivy scans every IaC exception mutation case
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: security-reports/iac-exception-controls
          format: json
          output: security-reports/control-iac-exceptions.json
          exit-code: '0'
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — every IaC exception mutation must fail the gate, the baseline must pass
        if: always()
        run: >-
          python3 security/iac_exception_controls.py check
          security-reports/control-iac-exceptions.json security-reports/iac-exception-controls

      - name: Negative control — Semgrep scans inert Python and TypeScript samples
        if: always()
        run: >-
          .security-venv/bin/semgrep scan --metrics=off --no-rewrite-rule-ids
          --timeout 60 --timeout-threshold 0 --config .security-venv/semgrep-rules
          --json --output security-reports/control-sast.json security/controls/sast

      - name: Negative control — the SAST gate must fail on them
        if: always()
        run: >-
          python3 security/gate.py sast security-reports/control-sast.json --name control-sast
          --expect-prefix security/controls/sast --expect-extension .py --expect-extension .ts --expect-fail

      - name: Negative control — SBOM of the inert lock
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: security/controls/vuln
          format: cyclonedx
          output: security-reports/control-sbom.cdx.json
          exit-code: '0'
          trivy-config: security/controls/trivy-control.yaml

      - name: Negative control — the SBOM gate must list the inert component
        if: always()
        run: >-
          python3 security/gate.py sbom security-reports/control-sbom.cdx.json --name control-sbom
          --kind filesystem --artifact security/controls/vuln --min-components 2 --commit "${{ github.event.pull_request.head.sha || github.sha }}" --checkout "${{ github.sha }}"

      # P6-CI-6 closure: the security-tool venv is scanned AS INSTALLED (its hash-locked Semgrep set
      # plus its pip, which the lock carries since CERT-2 2026-10-21, replacing the bundled one) and every distribution its
      # own pip inspect lists must be in that scan; the inventory is taken again just before the
      # completeness step, so anything installed after the scan fails completeness.
      - name: Inventory the security tooling venv as installed (pip inspect)
        if: always()
        run: .security-venv/bin/python -m pip inspect > security-reports/security-tooling-venv-installed.json

      # P6-CI-6 coverage gaps (operator order 2026-10-20): the packages the installed pip vendors (no dist-info) are
      # analysed from a staged pin list, and the Trivy binary on this job's PATH is analysed (Go binary analysis) and
      # bound to its pinned release digest (security/scanner-binaries.json).
      - name: Stage the packages the security tooling venv's installer vendors, and the scanner binary on this job's PATH
        if: always()
        run: |
          python3 security/stage_inputs.py vendored --out .vendored-pins --env security-venv .security-venv security-reports/security-tooling-venv-installed.json
          python3 security/stage_inputs.py binaries --pins security/scanner-binaries.json --job container-build --out .scanner-binaries --manifest security-reports/scanner-binaries-manifest.json

      - name: Trivy — packages vendored inside the installed environments (staged pin lists)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins
          scanners: vuln
          format: json
          output: security-reports/trivy-vendored-pins-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Trivy — the scanner binary on this job's PATH (Go binary analysis)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .scanner-binaries
          scanners: vuln
          format: json
          output: security-reports/trivy-scanner-binaries-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — security tooling venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .security-venv
          scanners: vuln
          format: json
          output: security-reports/trivy-security-tooling-venv-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Gate — security tooling venv (every installed distribution scanned; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-security-tooling-venv-vuln.json --name security-tooling-venv
          --kind tooling --artifact .security-venv --env-root .security-venv --min-lang-packages 60
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target security-venv/requirements-vendored-pip.txt
          --installed-inventory security-reports/security-tooling-venv-installed.json

      - name: Gate — the scanner binary on this job's PATH (pinned release digest, Go binary analysis present; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-scanner-binaries-vuln.json --name scanner-binaries
          --kind binary --artifact .scanner-binaries --binary-job container-build --binary-pins security/scanner-binaries.json
          --binary-manifest security-reports/scanner-binaries-manifest.json

      # Real-scanner negative control for the installed-environment (rootfs) scans: an inert dist-info
      # (metadata only, no code) of a known-vulnerable PyYAML, with its inventory, must be found by Trivy rootfs and fail
      # the tooling gate.
      - name: Negative control — Trivy scans an inert installed environment carrying a known CRITICAL (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/tooling-env
          scanners: vuln
          format: json
          output: security-reports/control-tooling-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — the tooling gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-tooling-rootfs.json --name control-tooling-rootfs
          --kind tooling --artifact security/controls/tooling-env --env-root security/controls/tooling-env --min-lang-packages 1
          --installed-inventory security/controls/tooling-env-installed.json --expect-fail

      # Real-scanner negative control for the vendored-pin scan: an inert environment (metadata only, no code) whose pip
      # declares a known-vulnerable PyYAML in pip/_vendor/vendor.txt, and nowhere else, must be staged, found by the Trivy
      # filesystem scan and fail the tooling gate with a violation in its vendored-pin target.
      - name: Negative control — stage the vendored pins of an inert environment whose installer vendors a known CRITICAL
        if: always()
        run: python3 security/stage_inputs.py vendored --out .vendored-pins-control --env control security/controls/vendored-env security/controls/vendored-env-installed.json

      - name: Negative control — Trivy scans the inert environment (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/vendored-env
          scanners: vuln
          format: json
          output: security-reports/control-vendored-env-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — Trivy scans its staged vendored pins
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins-control
          scanners: vuln
          format: json
          output: security-reports/control-vendored-pins.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Negative control — the tooling gate must fail on the vendored copy
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vendored-env-rootfs.json --name control-vendored-pins
          --kind tooling --artifact security/controls/vendored-env --env-root security/controls/vendored-env --min-lang-packages 1
          --vendored-report security-reports/control-vendored-pins.json --vendored-artifact .vendored-pins-control --vendored-target control/requirements-vendored-pip.txt
          --installed-inventory security/controls/vendored-env-installed.json --expect-fail
          --expect-violation target=control/requirements-vendored-pip.txt

      # Regression controls for the adopted vulnerability policy: each case copies one real report of
      # THIS run, injects one synthetic finding (or changes the population) and runs the real gate on the
      # copy, which must reach the case's stated outcome (security/vuln_policy_controls.py).
      - name: Negative control — the adopted vulnerability policy over this run's lock, API image and security tooling reports
        if: always()
        run: python3 security/vuln_policy_controls.py check container security-reports

      - name: Inventory the security tooling venv again, after every other step (a later install must fail)
        if: always()
        run: .security-venv/bin/python -m pip inspect > security-reports/security-tooling-venv-installed-final.json

      - name: Gate — security tooling venv, final inventory against the same scan
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-security-tooling-venv-vuln.json --name security-tooling-venv-final
          --kind tooling --artifact .security-venv --env-root .security-venv --min-lang-packages 60
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target security-venv/requirements-vendored-pip.txt
          --installed-inventory security-reports/security-tooling-venv-installed-final.json

      - name: Every required security analysis ran and was gated (completeness)
        if: always()
        run: >-
          python3 security/gate.py complete --name complete
          --expect-pass locks-vuln --expect-pass image-api-vuln --expect-pass image-worker-vuln
          --expect-pass security-tooling-venv --expect-pass security-tooling-venv-final --expect-pass scanner-binaries
          --expect-pass sbom-image-api --expect-pass sbom-image-worker --expect-pass sbom-locks
          --expect-pass iac --expect-pass sast --expect-pass control-sbom
          --expect-control control-vuln --expect-control control-iac --expect-control control-sast
          --expect-pass control-iac-exc-baseline
          --expect-control control-iac-exc-egress-port-range --expect-control control-iac-exc-egress-ipv6
          --expect-control control-iac-exc-egress-fourth-workload
          --expect-control control-iac-exc-egress-override-file --expect-control control-iac-exc-egress-tofu-shadow
          --expect-control control-iac-exc-entry-expired --expect-control control-iac-exc-entry-stale
          --expect-control control-iac-exc-listener-http-module-file
          --expect-control control-iac-exc-listener-http-new-module-file
          --expect-control control-iac-exc-listener-http-root-module
          --expect-control control-iac-exc-listener-alias-type --expect-control control-iac-exc-listener-nonliteral
          --expect-control control-iac-exc-tree-nonlocal-module --expect-control control-iac-exc-tree-escaping-local-module
          --expect-control control-iac-exc-tree-symlink-dotdot-escape --expect-control control-iac-exc-tree-tofu-file
          --expect-control control-iac-exc-tree-provisioner --expect-control control-iac-exc-alb-log-bucket-not-aes256
          --expect-control control-vulnpol-baseline-locks --expect-control control-vulnpol-baseline-api-image
          --expect-control control-vulnpol-baseline-security-tooling
          --expect-control control-vulnpol-critical-nofix-security-tooling
          --expect-control control-vulnpol-security-tooling-package-not-scanned
          --expect-control control-vulnpol-critical-fix-api-image-os
          --expect-control control-vulnpol-critical-nofix-api-image-os
          --expect-control control-vulnpol-critical-nofix-api-image-python
          --expect-control control-vulnpol-critical-fix-runtime-lock
          --expect-control control-vulnpol-critical-nofix-runtime-lock
          --expect-control control-vulnpol-critical-nofix-npm-runtime
          --expect-control control-vulnpol-critical-fix-npm-dev
          --expect-control control-vulnpol-critical-nofix-npm-dev
          --expect-control control-vulnpol-critical-fix-security-tool-lock
          --expect-control control-vulnpol-critical-nofix-security-tool-lock
          --expect-control control-vulnpol-critical-nofix-reader-tooling-lock
          --expect-control control-vulnpol-critical-status-fixed-no-version-runtime-lock
          --expect-control control-vulnpol-critical-wontfix-api-image-os
          --expect-control control-vulnpol-critical-fixdeferred-api-image-os
          --expect-control control-vulnpol-critical-eol-runtime-lock --expect-control control-vulnpol-critical-ghsa-npm-dev
          --expect-control control-vulnpol-critical-unmatched-uid-runtime-lock
          --expect-control control-vulnpol-critical-nofix-api-image-gobinary
          --expect-control control-vulnpol-high-status-fixed-no-version-runtime-lock
          --expect-control control-tooling-rootfs
          --expect-control control-vulnpol-high-fix-api-image --expect-control control-vulnpol-high-nofix-api-image
          --expect-control control-vulnpol-high-fix-runtime-lock
          --expect-control control-vulnpol-high-nofix-runtime-lock --expect-control control-vulnpol-high-fix-npm-dev
          --expect-control control-vulnpol-high-fix-security-tool-lock
          --expect-control control-vulnpol-undeclared-lock-target
          --expect-control control-vulnpol-missing-severity-runtime-lock
          --expect-control control-vendored-pins
          --expect-control control-vulnpol-critical-nofix-security-tooling-vendored-pin
          --expect-control control-vulnpol-security-tooling-vendored-pin-not-scanned
          --expect-control control-vulnpol-security-tooling-truncated-inventory
          --expect-control control-vulnpol-security-tooling-vendored-report-of-another-directory
          --expect-control control-vulnpol-api-image-installer-present
          --expect-control control-vulnpol-api-image-truncated-lang-packages
          --expect-control control-vulnpol-baseline-container-binaries
          --expect-control control-vulnpol-critical-nofix-container-binary-trivy
          --expect-control control-vulnpol-high-fix-container-binary-trivy
          --expect-control control-vulnpol-container-binary-trivy-analysis-missing
          --expect-control control-vulnpol-container-binary-trivy-stdlib-missing
          --expect-control control-vulnpol-container-binary-trivy-manifest-digest-differs

      - name: Upload security reports, SBOMs and gate summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-container-build
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn

  integration-smoke:
    name: Integration smoke
    runs-on: ubuntu-latest
    # Only run once the core quality + migration gates are green.
    needs: [frontend-quality, backend-quality, migration-and-contract]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Create fresh API virtualenv and install
        # P6-CI-6 coverage gaps (operator order 2026-10-20): pip and the setuptools build backend come from the
        # hash-locked apps/api/requirements-bootstrap.txt (the interpreter's bundled pip performs that one install and
        # is replaced by the locked pip) instead of an unpinned self-upgrade, and the editable install runs with
        # --no-build-isolation, so no unpinned build dependency is fetched; --only-binary :all: refuses a source build of any locked
        # dependency, whose build requirements pip would otherwise fetch unpinned and unhashed; --isolated ignores PIP_* variables and
        # user pip configuration, through which a constraint file could re-enable one. The venv is created with --clear,
        # so nothing an earlier step left there survives, and the last line makes it read-only, so no later step runs with it
        # writable; it is scanned as installed below.
        run: |
          python -m venv --clear apps/api/.venv
          apps/api/.venv/bin/python -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r apps/api/requirements-bootstrap.txt
          apps/api/.venv/bin/pip install --isolated --require-hashes --only-binary :all: -r apps/api/requirements-dev.txt
          apps/api/.venv/bin/pip install --no-deps --no-build-isolation -e apps/api
          python3 security/stage_inputs.py readonly apps/api/.venv

      # P6-CI-6 coverage gaps (operator order 2026-10-20): the API venv this job installed is scanned AS INSTALLED,
      # reconciled against its own pip inspect inventory and against its hash locks (installed == the locks' pins plus
      # the editable project), and the packages its pip vendors without dist-info are analysed from a staged pin list.
      # The environment was made read-only at the end of its own install, so no later step ran with it writable, and both of
      # its gates require that, so an ordinary later install or uninstall fails its step instead of escaping both
      # inventories; the inventory is taken again at the end of the job, so an install that does land fails completeness.
      # The Trivy binary on the job's PATH is analysed and bound to its pinned release digest (security/scanner-binaries.json).
      - name: Inventory the API venv as installed and stage the packages its installer vendors
        if: always()
        run: |
          mkdir -p security-reports
          apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed.json
          python3 security/stage_inputs.py vendored --out .vendored-pins --env api-venv apps/api/.venv security-reports/api-venv-installed.json

      - name: Trivy — API venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: apps/api/.venv
          scanners: vuln
          format: json
          output: security-reports/trivy-api-venv-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — packages vendored inside the installed environments (staged pin lists)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins
          scanners: vuln
          format: json
          output: security-reports/trivy-vendored-pins-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Stage the scanner binary on this job's PATH
        if: always()
        run: python3 security/stage_inputs.py binaries --pins security/scanner-binaries.json --job integration-smoke --out .scanner-binaries --manifest security-reports/scanner-binaries-manifest.json

      - name: Trivy — the scanner binary on this job's PATH (Go binary analysis)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .scanner-binaries
          scanners: vuln
          format: json
          output: security-reports/trivy-scanner-binaries-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Gate — the scanner binary on this job's PATH (pinned release digest, Go binary analysis present; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-scanner-binaries-vuln.json --name scanner-binaries
          --kind binary --artifact .scanner-binaries --binary-job integration-smoke --binary-pins security/scanner-binaries.json
          --binary-manifest security-reports/scanner-binaries-manifest.json

      - name: Gate — API venv (every installed distribution scanned, exactly the locks, vendored packages analysed; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed.json

      - name: Prepare a fresh, migrated + seeded demo database
        # Python-only job: call the bash script directly (no npm/Node dependency).
        run: |
          rm -f apps/api/signalnest.db
          bash scripts/demo-setup.sh

      - name: HTTP isolation smoke test
        # ci-smoke.sh starts uvicorn, waits on /health with a bounded loop, runs
        # scripts/smoke_http.py, and always stops the server (trap on EXIT).
        run: bash scripts/ci-smoke.sh

      # Real-scanner negative control for the installed-environment (rootfs) scans (this job runs its own Trivy and DB): an inert
      # dist-info (metadata only, no code) of a known-vulnerable PyYAML, with its inventory, must be found by Trivy rootfs and fail
      # the tooling gate.
      - name: Negative control — Trivy scans an inert installed environment carrying a known CRITICAL (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/tooling-env
          scanners: vuln
          format: json
          output: security-reports/control-tooling-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — the tooling gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-tooling-rootfs.json --name control-tooling-rootfs
          --kind tooling --artifact security/controls/tooling-env --env-root security/controls/tooling-env --min-lang-packages 1
          --installed-inventory security/controls/tooling-env-installed.json --expect-fail

      # Real-scanner negative control for the vendored-pin scan: an inert environment (metadata only, no code) whose pip
      # declares a known-vulnerable PyYAML in pip/_vendor/vendor.txt, and nowhere else, must be staged, found by the Trivy
      # filesystem scan and fail the tooling gate with a violation in its vendored-pin target.
      - name: Negative control — stage the vendored pins of an inert environment whose installer vendors a known CRITICAL
        if: always()
        run: python3 security/stage_inputs.py vendored --out .vendored-pins-control --env control security/controls/vendored-env security/controls/vendored-env-installed.json

      - name: Negative control — Trivy scans the inert environment (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/vendored-env
          scanners: vuln
          format: json
          output: security-reports/control-vendored-env-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — Trivy scans its staged vendored pins
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins-control
          scanners: vuln
          format: json
          output: security-reports/control-vendored-pins.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Negative control — the tooling gate must fail on the vendored copy
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vendored-env-rootfs.json --name control-vendored-pins
          --kind tooling --artifact security/controls/vendored-env --env-root security/controls/vendored-env --min-lang-packages 1
          --vendored-report security-reports/control-vendored-pins.json --vendored-artifact .vendored-pins-control --vendored-target control/requirements-vendored-pip.txt
          --installed-inventory security/controls/vendored-env-installed.json --expect-fail
          --expect-violation target=control/requirements-vendored-pip.txt

      - name: Negative control — the adopted vulnerability policy over this job's installed-environment reports
        if: always()
        run: python3 security/vuln_policy_controls.py check integration security-reports

      - name: Inventory the API venv again, after every other step (a later install must fail)
        if: always()
        run: apps/api/.venv/bin/python -m pip inspect > security-reports/api-venv-installed-final.json

      - name: Gate — API venv, final inventory against the same scans
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-api-venv-vuln.json --name api-venv-final
          --kind tooling --artifact apps/api/.venv --env-root apps/api/.venv --min-lang-packages 52
          --locked-by apps/api/requirements-bootstrap.txt --locked-by apps/api/requirements-dev.txt --locked-extra signalnest-api
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target api-venv/requirements-vendored-pip.txt
          --require-read-only
          --installed-inventory security-reports/api-venv-installed-final.json

      - name: Every required installed-environment analysis of this job ran and was gated (completeness)
        if: always()
        run: >-
          python3 security/gate.py complete --name complete
          --expect-pass api-venv --expect-pass api-venv-final --expect-pass scanner-binaries
          --expect-control control-tooling-rootfs --expect-control control-vendored-pins
          --expect-control control-vulnpol-baseline-integration-api-venv
          --expect-control control-vulnpol-critical-nofix-integration-api-venv
          --expect-control control-vulnpol-critical-nofix-integration-api-venv-vendored-pin
          --expect-control control-vulnpol-high-fix-integration-api-venv
          --expect-control control-vulnpol-integration-api-venv-package-not-scanned
          --expect-control control-vulnpol-integration-api-venv-installed-after-scan
          --expect-control control-vulnpol-integration-api-venv-installed-outside-the-locks
          --expect-control control-vulnpol-integration-api-venv-version-differs-from-the-lock
          --expect-control control-vulnpol-integration-api-venv-vendored-pin-not-scanned
          --expect-control control-vulnpol-integration-api-venv-vendored-report-of-another-directory
          --expect-control control-vulnpol-integration-api-venv-truncated-inventory
          --expect-control control-vulnpol-integration-api-venv-project-not-from-the-checkout
          --expect-control control-vulnpol-integration-api-venv-project-from-an-index-url
          --expect-control control-vulnpol-integration-api-venv-project-from-outside-the-workspace
          --expect-control control-vulnpol-baseline-integration-binaries
          --expect-control control-vulnpol-critical-nofix-integration-binary-trivy
          --expect-control control-vulnpol-high-fix-integration-binary-trivy
          --expect-control control-vulnpol-integration-binary-trivy-analysis-missing
          --expect-control control-vulnpol-integration-binary-trivy-stdlib-missing
          --expect-control control-vulnpol-integration-binary-trivy-manifest-digest-differs

      - name: Upload integration smoke security reports and gate summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-integration
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: api-smoke.log
          retention-days: 7

  revision-reader:
    name: Revision reader (unit, IaC contract, in-image)
    runs-on: ubuntu-latest
    # Gate 4J. The reader's safety is a set of ABSENCES — no Alembic, no application
    # package, no shell, no argv acceptance, no entryPoint in the task definition. An
    # absence does not fail loudly when it stops holding, so every one is asserted here at
    # PR time. reader-publish.yml replays the in-image band at publish time as a
    # fail-closed check against the artefact that is actually pushed.
    #
    # GATE 4N-I26B, closing I25's VAL-CI. The anchor tier used to be published mid-job with
    # `>> "$GITHUB_ENV"`, which reaches only SUBSEQUENT steps — so `closure`, which ran two
    # steps earlier, executed with it UNSET and died on an uncaught module-level AnchorError.
    # CI was deterministically red and no local run reproduced it, because the guard harness
    # pre-exported the variable before every step and therefore measured a state the runner
    # never has. Declaring it at JOB scope makes it available to every step from the first,
    # which removes the ordering hazard rather than reordering around it: there is now exactly
    # one producer and it cannot come after any consumer. scripts/ci_env_dataflow.py proves
    # availability precedes consumption for every consumed variable, and fails closed on any
    # it cannot resolve.
    env:
      SIGNALNEST_ANCHOR_TIER: TIER_1_SYNTHETIC
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/revision-reader/pyproject.toml

      - name: Install the reader (editable) with its dev extra, from the hash-locked tooling lock
        # Editable, so the tests exercise the working tree rather than a copy in
        # site-packages that could drift from what the image builds.
        # P6-CI-6 closure (operator order 2026-10-19): every package this venv holds comes from the
        # hash-locked apps/revision-reader/requirements-dev.txt (the dev extra, the reader's own
        # dependencies, pip itself, the setuptools build backend and PyYAML), installed with
        # --require-hashes --no-deps. The interpreter's bundled bootstrap pip performs that one install
        # and is replaced by the locked pip; the editable install runs with --no-build-isolation, so no
        # unpinned build dependency is fetched. The venv is scanned AS INSTALLED and reconciled against
        # its own pip inspect inventory at the end of this job (twice, so a later install fails).
        run: |
          python -m venv --clear .reader-venv
          .reader-venv/bin/python -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r apps/revision-reader/requirements-dev.txt
          .reader-venv/bin/python -m pip install --no-deps --no-build-isolation -e apps/revision-reader
          .reader-venv/bin/python -m pip check
          # GATE 4N-I28BH-E2. The main Gate-4N security suite runs UNDER this reader venv
          # (the "Operator permission-set policy and cache-classification tests" step), and its
          # strict bootstrap (signalnest_bootstrap.establish -> executable_inventory) imports
          # yaml. The venv is isolated (no --system-site-packages), so the system-python install
          # of the pinned Gate contract below does NOT reach it. Install the SAME pinned contract
          # here so every interpreter that executes a YAML-dependent Gate consumer has PyYAML.
          # (Already satisfied: the hash-locked install above carries the same PyYAML pin, and
          # security/test_tooling_locks.py fails if the two pins ever differ.)
          .reader-venv/bin/pip install -r scripts/requirements-gate.txt

      # GHSA-6q48-6c7w-9gw2 (certifi < 2026.10.19), 2026-10-21: the interpreter prefix this job's system
      # python3 lives in (the runner's toolcache, pythonLocation) is scanned AS INSTALLED below, and the pip
      # that actions/setup-python provisions there vendors a certifi bundle of its own (pip 26.2.1 vendors
      # certifi 2026.6.17: CRITICAL under the adopted policy). No repository file controlled that pip, so
      # the prefix's pip is replaced from a hash lock BEFORE anything else is installed into the prefix:
      # the second hash-locked install into it, of the same form as the Gate 4N PyYAML one below. The
      # bundled pip performs this one install and is replaced by the locked pip, whose pin equals the
      # reader tooling lock's (security/test_tooling_locks.py keeps them equal). --only-binary :all:
      # refuses a source build; --isolated ignores PIP_* variables and user pip configuration.
      - name: Install the locked pip into the job's interpreter prefix (replaces the toolcache's bundled pip)
        run: |
          python3 -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r apps/revision-reader/requirements-toolcache-pip.txt

      # GATE 4N-I26C. The Gate 4N guards run under the SYSTEM python3, not the reader venv, and
      # three of them parse this workflow as YAML. Gate 4N-I26B shipped them depending on a
      # PyYAML nothing installed: on a runner all three would have exited 2 "refused", which
      # reads like a policy decision rather than a missing package. Installed HERE, before the
      # first guard, from the pinned contract in scripts/requirements-gate.txt.
      # P6-CI-6 closure: installed from scripts/requirements-gate-hashes.txt, the hash lock compiled
      # from that contract (the same PyYAML pin), with --require-hashes --no-deps.
      - name: Install Gate 4N guard dependencies
        # --only-binary :all: (P6-CI-6 coverage gaps): a source build would fetch its build requirements unpinned and unhashed;
        # --isolated: no PIP_* variable or user configuration (a constraint file could re-enable a source build) applies.
        run: |
          python3 -m pip install --isolated --require-hashes --only-binary :all: --no-deps -r scripts/requirements-gate-hashes.txt

      - name: Gate 4N guard dependency contract
        id: gate_dependencies
        if: always()
        run: python3 scripts/check_gate_dependencies.py

      - name: Ruff check
        run: .reader-venv/bin/python -m ruff check apps/revision-reader

      - name: Reader unit and build-contract tests
        working-directory: apps/revision-reader
        run: ../../.reader-venv/bin/python -m pytest tests -q

      # Gate 4N-I8: the iam module now carries boundary_durability.tftest.hcl, which proves
      # the permissions boundary reaches all five roles and that a null input is the removal
      # state. Offline, mocked provider, no backend — same shape as the reader tests.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # Pinned to the Gate 4N execution contract. Without this the action installs
          # `latest`, and scripts/check_toolchain_integrity.py would assert a version the
          # workflow never established.
          tofu_version: 1.12.5
          tofu_wrapper: false

      # --- Gate 4N-I4: operator permission and toolchain guards -------------------
      # Ordering matters and was wrong in Gate 4N-I3, where the toolchain check ran
      # AFTER the module init that legitimately creates a module-local .terraform,
      # failed on its mere existence, and — because steps are sequential — suppressed
      # the policy tests entirely. The corrected graph is:
      #   1. sanitize the environment BEFORE anything initialises
      #   2. initialise the module (creates an EXPECTED cache)
      #   3. re-verify the toolchain, now classifying that cache by contents
      #   4. run the policy tests regardless of step 3's outcome
      #   5. a final gate fails the job if any required step failed
      # No step uses unconditional continue-on-error; every failure still fails the job.
      - name: IAM module boundary durability contract tests
        id: iam_module_tests
        if: always()
        working-directory: infra/aws/modules/iam
        run: |
          tofu init -backend=false -input=false
          tofu test

      - name: Toolchain integrity — pre-init environment sanitization
        id: toolchain_pre
        run: python3 scripts/check_toolchain_integrity.py

      - name: Reader IaC contract tests (offline, fully mocked provider)
        id: module_tests
        working-directory: infra/aws/modules/revision_reader
        run: |
          tofu fmt -check -diff .
          tofu init -backend=false -input=false
          tofu test

      # Staging window (docs/operations/staging-window.md): alb, data_cache and network prove
      # their open/closed shapes in window.tftest.hcl — offline, fully mocked provider, no
      # backend, no AWS call; each module carries the root's byte-identical provider
      # constraint so its standalone init resolves the pinned 6.55.0. The three caches are
      # classified by the post-init step below (EXPECTED_CACHE_ROOTS, reviewed under
      # REV-2026-10-01-P6-STAGING-WINDOW-CI-CACHE-ROOTS). Expected runs: alb 9 (window.tftest.hcl
      # 3 + api_alias.tftest.hcl 6 — the P6-INF-3 windowed API alias record), data_cache 2,
      # network 2. The negative control proves a failing window suite fails its step: a
      # doctored copy of the network module with one false assertion, initialised offline
      # from the already-verified network cache, must make `tofu test` exit non-zero.
      - name: Staging-window contract tests — alb (offline, fully mocked provider)
        id: window_tests_alb
        if: always()
        working-directory: infra/aws/modules/alb
        run: |
          tofu fmt -check -diff .
          tofu init -backend=false -input=false
          tofu test

      - name: Staging-window contract tests — data_cache (offline, fully mocked provider)
        id: window_tests_data_cache
        if: always()
        working-directory: infra/aws/modules/data_cache
        run: |
          tofu fmt -check -diff .
          tofu init -backend=false -input=false
          tofu test

      - name: Staging-window contract tests — network (offline, fully mocked provider)
        id: window_tests_network
        if: always()
        working-directory: infra/aws/modules/network
        run: |
          tofu fmt -check -diff .
          tofu init -backend=false -input=false
          tofu test

      - name: Staging-window negative control — a failing window suite must fail
        id: window_negative_control
        if: always()
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import pathlib, shutil, sys
          # Copy the real network module OUTSIDE the tree (so the post-init classification sees no
          # unexpected cache) and doctor its suite: the real 2 runs plus one always-false assertion
          # that references a module input (OpenTofu rejects a bare `false` as "checking nothing").
          work = pathlib.Path(sys.argv[1])
          shutil.copytree("infra/aws/modules/network", work / "network",
                          ignore=shutil.ignore_patterns(".terraform", ".terraform.lock.hcl"))
          (work / "network" / "window.tftest.hcl").open("a").write(
              '\nrun "negative_control_must_fail" {\n  command = plan\n  assert {\n'
              '    condition     = var.name_prefix != var.name_prefix\n'
              '    error_message = "negative control: a failing window suite must fail its CI step"\n'
              '  }\n}\n')
          PY
          cd "$work/network"
          tofu init -backend=false -input=false -plugin-dir="$GITHUB_WORKSPACE/infra/aws/modules/network/.terraform/providers"
          python3 - "$work/negative.log" <<'PY'
          import pathlib, subprocess, sys
          # The doctored suite MUST fail. A zero exit, or a log that does not show exactly that run
          # failing while the two real runs still pass, fails this step.
          log = pathlib.Path(sys.argv[1])
          proc = subprocess.run(["tofu", "test", "-no-color"], capture_output=True, text=True)
          text = proc.stdout + proc.stderr
          log.write_text(text)
          sys.stdout.write(text)
          ok = (proc.returncode != 0
                and 'run "negative_control_must_fail"... fail' in text
                and "1 failed" in text and "2 passed" in text)
          print(f"negative control: exit={proc.returncode} verdict={'FAILED_AS_REQUIRED' if ok else 'DID_NOT_FAIL_AS_REQUIRED'}")
          sys.exit(0 if ok else 1)
          PY

      # Root input-boundary + alias-wiring contract (infra/aws/input_boundary.tftest.hcl): what
      # only the ROOT can prove — monthly_budget_limit is bounded by the operator's USD 20 TOTAL
      # monthly limit (21 and the historical 200 ceiling are rejected, 20 accepted), api_fqdn is
      # rejected when it collides with web_fqdn, and the single window input gates the API alias
      # record while the web alias persists. Offline, fully mocked provider (sibling-module
      # validations need ARN-/id-shaped mock defaults; the network module is overridden as a
      # whole for distinct subnet ids), `-backend=false` so the committed S3 backend is NEVER
      # initialised, no AWS call. The root cache infra/aws is already an EXPECTED_CACHE_ROOTS
      # member (and a root_wiring_check mirror source, verified against the committed lockfile).
      # The same step also runs cmk_remediation.tftest.hcl (P6-CI-6): module-targeted runs that
      # render the edge, observability and storage modules' customer-managed-key wiring.
      # The same step also runs data_sql_sg_contract.tftest.hcl (AL-1, PR #248: the applied RDS security-group description).
      # Expected runs: 13 (7 + 4 + 2). Placed before toolchain_post so the cache it creates is classified.
      - name: Root input-boundary and alias-wiring contract tests (offline, fully mocked provider)
        id: root_boundary_tests
        if: always()
        working-directory: infra/aws
        run: |
          tofu fmt -check -diff .
          tofu init -backend=false -input=false
          tofu test

      - name: Toolchain integrity — post-init cache classification
        id: toolchain_post
        if: always() && steps.toolchain_pre.outcome != 'skipped'
        run: python3 scripts/check_toolchain_integrity.py

      # INFRA-9 B-3. Root-wiring regression guard: OpenTofu itself is the configuration
      # oracle (no HCL parsing — a prior hand-rolled scanner fell to six rounds of
      # fail-open evasions). The checker copies the git-tracked infra/aws tree into
      # $RUNNER_TEMP (digest-bound both before AND after the plan), overrides the
      # backend to `local` inside the copy only, installs the pinned provider from a
      # filesystem mirror built from the module-test cache the steps above created
      # (verified against the committed root lockfile h1 set and provider-binary-pin;
      # no registry download, no network fallback), then completes an offline
      # `tofu plan -refresh=false` against a 127.0.0.1-only synthetic STS stub and
      # asserts the provider wiring in `tofu show -json` (primary) and `tofu graph`
      # (independent witness): aws.revision_reader carries exactly {region}; the full
      # 15-resource aws_* reader roster binds to it; nothing else does; the default provider
      # keeps {default_tags, region}; exactly one module call sources the reader.
      # --mode full additionally runs the complete negative mutation battery on
      # doctored copies — every battery row must fail at its designated stage with its
      # expected signature, so plan-JSON/DOT format drift fails closed instead of
      # going silently green. This step also gives root main.tf/providers.tf their
      # fmt/validate gate. The committed S3 backend is NEVER initialized; the
      # subprocess environment is constructed from an allowlist (synthetic
      # credentials, IMDS disabled, localhost endpoint), never inherited.
      - name: Root wiring — reader provider mapping and aliased-surface guard
        id: root_wiring
        if: always()
        run: python3 scripts/root_wiring_check.py --mode full

      - name: IAM role permissions-boundary coverage (fail-closed)
        id: boundaries
        if: always()
        run: python3 scripts/check-iam-role-boundaries.py

      # Runs even when a diagnostic check above failed: a red toolchain check must
      # never hide a policy regression. Its own failure still fails the job via the gate.
      - name: Closure verification (repository graph JOIN provider API map)
        id: closure
        if: always()
        run: python3 scripts/verify_closure.py

      # Independent of the policy generators: derives expected ARNs from repository
      # expressions, a live inventory and AWS ARN rules, and fails closed on any
      # derivation it cannot resolve.
      # The account is anchored OUTSIDE the repository. A repository-wide replacement now
      # produces a MISMATCH instead of silent agreement.
      # GATE 4N-I13: ordinary CI declares TIER_1_SYNTHETIC explicitly. There is no default
      # and no discovery — an undeclared tier fails closed rather than reading a home
      # directory. Tier 1 validates MECHANICS and certifies nothing about production
      # identity; that is Tier 2's job, contracted separately below.
      - name: Declare Tier 1 synthetic anchor
        id: anchor_tier
        if: always()
        run: |
          # GATE 4N-I26B. The `>> "$GITHUB_ENV"` write that used to be here is GONE: the tier is
          # declared once at job scope, so this step validates it instead of publishing it. Two
          # producers for one value is how a consumer ends up reading the wrong one.
          test -f tests/fixtures/synthetic-anchor.json
          test "$SIGNALNEST_ANCHOR_TIER" = "TIER_1_SYNTHETIC"
          python3 scripts/anchor_loader.py --tier TIER_1_SYNTHETIC

      - name: External identity anchor join
        id: anchor
        if: always()
        run: python3 scripts/external_anchor.py

      # Deny requirements come from the external incident ledger plus architecture
      # invariants, never from the policy generators.
      - name: Independent Deny requirements
        id: deny_requirements
        if: always()
        run: python3 scripts/deny_requirements.py

      # Every resource-scoped Deny is probed at the resource it protects, and every Deny
      # statement is deleted in turn to prove something notices.
      - name: Resource-specific Deny probes
        id: deny_probes
        if: always()
        run: python3 scripts/resource_deny_probes.py

      # Reconciles every mandatory Deny across incident ledger, architecture invariant,
      # protected resource, generated policy and explicit probe.
      # Final-defender exhaustion replaced the unfalsifiable I10 scorer.
      # Every lifecycle step has an owner, and each owner is PROVEN to hold its action
      # against the generated policy — not asserted in prose.
      - name: RoleBootstrap lifecycle owner graph
        id: lifecycle
        if: always()
        run: python3 scripts/role_bootstrap_lifecycle.py

      # Every provenance label checked against an exact source and field; weak labels
      # cannot authorize production.
      - name: Provenance cross-check
        id: provenance
        if: always()
        run: python3 scripts/provenance.py

      - name: Deny final-defender exhaustion
        id: exhaustion
        if: always()
        run: python3 scripts/deny_exhaustion.py

      # Component-wise ARN comparison; a regex cannot see a one-character corruption.
      - name: Semantic critical-ARN model
        id: arn_model
        if: always()
        run: python3 scripts/arn_model.py

      # Discovery-based: a new policy artifact cannot escape validation.
      - name: Every-policy validation by discovery
        id: policy_validation
        if: always()
        run: python3 scripts/policy_inventory.py

      - name: Deny triangulation and per-action mutation score
        id: triangulation
        if: always()
        run: python3 scripts/deny_triangulation.py --mutations

      # Resolves real HCL expressions instead of restating naming conventions.
      - name: Repository expression resolution
        id: expressions
        if: always()
        run: python3 scripts/hcl_expressions.py

      - name: Trust-policy validator (independent)
        id: trust
        if: always()
        run: python3 scripts/trust_validator.py

      - name: Independent resource oracle (fail-closed)
        id: oracle
        if: always()
        run: python3 scripts/resource_oracle.py

      # The Allow axis. Every prior gate mutated only Denies, so a widened grant moved
      # no check at all. Requires 0 escapes, 0 losses and 0 unclassified grants.
      - name: Allow-axis model and both-sided ceiling proof
        id: allow_axis
        if: always()
        run: python3 scripts/allow_model.py

      # Ownership is COMPUTED by evaluating each rollout operation against the assigned
      # principal's policy, not asserted as a constant in a JSON file.
      - name: Boundary rollout ownership
        id: rollout
        if: always()
        run: python3 scripts/gen_boundary_rollout.py --check

      # GATE 4N-I16 DEFECT 4. The candidate under test is named EXPLICITLY. CI declares the
      # tracked SYNTHETIC fixture, which exercises the discovery mechanism without any real
      # candidate present — and candidate_manifest.load() refuses a synthetic manifest that
      # claims production certification, so this can never bless a real candidate.
      - name: Frozen-candidate discovery contract
        id: candidate_discovery
        if: always()
        env:
          SIGNALNEST_CANDIDATE_MANIFEST: ${{ github.workspace }}/tests/fixtures/candidate-manifest.json
        run: python3 scripts/candidate_manifest.py

      # GATE 4N-I16 DEFECT 3. iam:PutRolePolicy is CLASSIFIED from primary evidence rather
      # than excluded from the closure. UNKNOWN fails the gate.
      - name: iam:PutRolePolicy closure classification
        id: putrolepolicy
        if: always()
        run: python3 scripts/putrolepolicy_classification.py

      # GATE 4N-I16 DEFECT 5. The read-only verifier's policy must generate and must contain
      # no mutating action; the generator refuses rather than relying on review.
      - name: ReadOnlyVerifier policy generation
        id: verifier_policy
        if: always()
        run: |
          # GATE 4N-I19, ADV-A. Issuance and expiry travel TOGETHER. A free-floating expiry is
          # what let Gate 4N-I17 ship a window nothing bounded; both halves now come from the
          # single reviewed pair in scripts/expiry_authorization.py, and generation refuses any
          # window outside the 24-hour authorized maximum.
          python3 scripts/expiry_authorization.py
          python3 scripts/gen_readonly_verifier_policy.py \
            --issuance 2026-08-14T12:00:00Z --expiry 2026-08-15T10:00:00Z

      - name: Independent ReadOnlyVerifier ceiling (decisive, not the self-derived Deny)
        id: verifier_ceiling
        if: always()
        run: python3 scripts/verifier_ceiling.py

      # GATE 4N-I20, ARCH-H2. The role reconciler had NO executed consumer: nothing ran it, and
      # as wired it compared the expected set against itself so OVER_GRANTED and UNDER_GRANTED
      # were unreachable. It now reads the GENERATED side back out of the emitted policy and
      # runs here, so a divergence between the Terraform declarations and the policy actually
      # granted fails the job.
      # GATE 4N-I23, BLOCKER 2. The expected side now comes from the INDEPENDENTLY AUTHORED
      # requirement (tests/fixtures/expected-writable-roles.json), not from
      # role_arns(writable_roles()) — which was the same expression the generated side was
      # read back from. Poisoning writable_roles() to call migration-task writable now moves
      # only the generated side and surfaces as OVER_GRANTED.
      - name: Terraform role inventory reconciliation (authored requirement vs emitted policy)
        id: role_inventory
        if: always()
        run: python3 scripts/terraform_role_inventory.py

      # GATE 4N-I23, closing I22 finding F1. protected_inventory.repository_is_clean() was
      # called only from its own main(), and neither script appeared in this workflow at all —
      # so the SEC-1 containment invariant had no executed consumer. protected_inventory.py:60
      # states the requirement itself: "the containment is only real if re-adding the file is
      # noticed."
      - name: Live-identifier containment (leak scan + protected inventory)
        id: containment
        if: always()
        run: |
          python3 scripts/leak_scan.py
          python3 scripts/protected_inventory.py

      # GATE 4N-I23, BLOCKER 1. I22 froze a candidate whose predicted commit tree was verified
      # eleven times and never READ: it held 14 fixtures, a workflow invoking 26 absent
      # scripts, and zero test files. A stable tree hash proves the package has not CHANGED,
      # never that it is COHERENT. This materialises the predicted tree and requires it to be
      # able to run its own verification package.
      # GATE 4N-I24C, findings I24C-06 and I24C-07. I23 asserted CI wiring with a bare
      # substring plus an echo guard that inspected " |" under block scalars and therefore
      # could not fail; and policy_tests — the only step that runs pytest — was referenced by
      # zero tests. This parses every graded step's run scalar as executable shell and proves
      # INVOCATION against an authored contract.
      - name: CI structural invocation model (all graded steps)
        id: ci_invocation
        if: always()
        run: python3 scripts/ci_invocation_model.py

      # GATE 4N-I24C, finding I24C-05 (adversarial X4, I23's mandatory YES). Package
      # completeness measured against an INDEPENDENTLY AUTHORED contract. The coherence
      # checker below stays within its own narrower contract: referenced-path existence.
      # GATE 4N-I24C, findings I24C-01/-10/-11. Evidence must declare the object it
      # describes and a consumer must verify that declaration against live state. I23 froze a
      # candidate whose every tree-bearing artifact adjudicated a superseded tree.
      # GATE 4N-I24C, findings I24C-12/-13. Mutation sites DISCOVERED from AST, the workflow
      # graph and the authored contracts — never a hand-authored list. I23 reported 20/20
      # caught while three of its rows were falsified by execution.
      # GATE 4N-I24D, closing I24C-12. EXECUTED coverage: each load-bearing value is mutated
      # in its real fixture and the real shipping guard must refuse. Names, strings and set
      # membership never count.
      - name: Executed site coverage
        id: site_coverage
        if: always()
        run: python3 scripts/site_coverage.py

      - name: Mutation-site discovery coverage
        id: mutation_discovery
        if: always()
        # GATE 4N-I26C. Failing on problems is now this guard's DEFAULT; the flag is
        # passed explicitly so the graded invocation states the mode it relies on.
        run: python3 scripts/mutation_discovery.py --fail-on-untested-layer

      - name: Evidence binding and freshness
        id: evidence_binding
        if: always()
        # GATE 4N-I26B, closing ARCH-C1. This ran with NO mode flag, and the no-argument
        # branch returned {"problems": [], "fresh": True} — literals — so the graded step
        # exited 0 for every repository state. The mode is now NAMED, the default verifies
        # too, and tests assert this exact invocation.
        run: python3 scripts/evidence_binding.py --selftest

      - name: Independent package completeness
        id: package_requirements
        if: always()
        run: python3 scripts/package_requirements.py

      - name: Predicted commit package coherence
        id: package_coherence
        if: always()
        run: python3 scripts/commit_package_coherence.py

      # GATE 4N-I23, BLOCKER 3. I22 finding F2: the two-lineage guard was a hand-written list
      # of six ids while seven rows needed it, and the omitted row was secrets_cmk_key_id —
      # the row the mechanism exists for. Coverage is now discovered and accounted in both
      # directions, and provenance.py's exit code depends on it.
      - name: Provenance row coverage (complete, discovered)
        id: provenance_coverage
        if: always()
        run: python3 scripts/provenance.py

      # GATE 4N-I20, ARCH-H3/AWS-3. Records HEAD, the index, the working tree and the PREDICTED
      # COMMIT TREE as separate bindings, so a manifest can never again call a staged file
      # committed.
      - name: Authoritative git state and predicted commit tree
        id: tracked_state
        if: always()
        run: python3 scripts/tracked_state.py

      # Certification is a CONSUMER, not metadata: a local run is candidate-validated and the
      # production gate refuses anything that is not PRODUCTION_CERTIFIED.
      - name: Production-certification state (local runs are never certified)
        id: certification
        if: always()
        run: python3 scripts/production_certification.py state

      # GATE 4N-I20B. Gate 4N-I20A proved the previous CI step could not have caught a
      # regression in the real production entry point: it ran the module's default mode, which
      # reports the local state and exits 0, and never reached the artifact-validating gate. A
      # fabricated artifact — invented candidate, invented HEAD, invented commit tree, empty
      # check list — was PERMITTED with exit 0.
      #
      # This step exercises the REAL `verify` path with mandatory bindings, in a non-production
      # test mode using protected-EQUIVALENT synthetic fixtures. It asserts BOTH directions:
      # the exploit must be refused and a legitimately generated artifact must be permitted.
      # It certifies nothing — the fixtures are synthetic and the run is CI-equivalent only.
      - name: Production gate — real artifact validation (exploit refused, valid permitted)
        id: certification_gate
        if: always()
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import hashlib, json, subprocess, sys, pathlib
          sys.path.insert(0, "scripts")
          import production_certification as pc

          work = pathlib.Path(sys.argv[1])
          evidence = work / "evidence.json"
          evidence.write_text(json.dumps({"approved_account_id": "111122223333",
                                          "partition": "aws",
                                          "_note": "protected-equivalent CI fixture"}))
          evidence_sha = hashlib.sha256(evidence.read_bytes()).hexdigest()
          inventory_sha = "b" * 64
          candidate = {"candidate_id": "SYNTHETIC-CI-FIXTURE-CANDIDATE-1",
                       "candidate_manifest_sha256": "a" * 64}
          external = {"protected_tier": "TIER_2_PROTECTED",
                      "external_anchor_sha256": evidence_sha,
                      "external_inventory_sha256": inventory_sha}
          checks = [{"check_id": c["check_id"], "status": "PASSED"}
                    for c in pc.required_checks()]
          (work / "candidate.json").write_text(json.dumps(candidate))
          (work / "external.json").write_text(json.dumps(external))
          (work / "checks.json").write_text(json.dumps({"checks": checks}))

          # THE GATE 4N-I20A EXPLOIT: every binding fabricated, checks empty.
          (work / "exploit.json").write_text(json.dumps({
              "schema_version": pc.SCHEMA_VERSION,
              "certification_state": pc.PRODUCTION_CERTIFIED, "certifies_production": True,
              "candidate_id": "TOTALLY-MADE-UP-CANDIDATE",
              "candidate_manifest_sha256": "a" * 64, "head": "b" * 40,
              "index_tree_hash": "c" * 40, "commit_tree_hash": "d" * 40,
              "repository_diff_sha256": "e" * 64, "external_anchor_sha256": "f" * 64,
              "external_inventory_sha256": "0" * 64, "protected_tier": "TIER_2_PROTECTED",
              "certified_at_utc": "2026-08-01T00:00:00Z",
              "valid_until_utc": "2099-01-01T00:00:00Z", "checks": [],
              "certifier_provenance": "anything", "eligibility_sha256": "9" * 64}))

          def run(*args):
              return subprocess.run([sys.executable, "scripts/production_certification.py", *args],
                                    capture_output=True, text=True)

          refused = run("verify", "--artifact", str(work / "exploit.json"),
                        "--candidate-manifest", str(work / "candidate.json"),
                        "--external-binding", str(work / "external.json"))
          assert refused.returncode != 0, "THE PRODUCTION GATE PERMITTED A FABRICATED ARTIFACT"
          print("  exploit refused, exit", refused.returncode)

          assert run("verify", "--artifact", str(work / "exploit.json")).returncode != 0, \
              "an artifact-only verify mode is reachable"
          print("  artifact-only mode refused")

          elig = run("eligibility", "--tier2-evidence", str(evidence),
                     "--evidence-sha256", evidence_sha, "--inventory-sha256", inventory_sha,
                     "--candidate-manifest", str(work / "candidate.json"),
                     "--checks", str(work / "checks.json"), "--out", str(work / "elig.json"))
          assert elig.returncode == 0, elig.stderr
          # GATE 4N-I23, closing I22 architect finding H3. This step USED to assert that
          # `certify` succeeded and that the resulting PRODUCTION_CERTIFIED /
          # certifies_production:true artifact was permitted — so every CI run manufactured a
          # production certificate that the gate accepted. Its non-reuse rested on the mktemp
          # directory, not on any property of the artifact, and the "certifies nothing" claim
          # in this file's comments was something the mechanism could not actually conclude.
          # The candidate id now carries the SYNTHETIC- prefix, which makes non-certification
          # STRUCTURAL: it cannot be omitted from a fixture to make the pipeline go green.
          cert = run("certify", "--eligibility", str(work / "elig.json"),
                     "--certifier", "CI synthetic fixture", "--out", str(work / "cert.json"))
          assert cert.returncode != 0, (
              "CI produced a PRODUCTION_CERTIFIED artifact for a SYNTHETIC- candidate")
          assert "can never certify production" in (cert.stdout + cert.stderr), \
              cert.stdout + cert.stderr
          assert not (work / "cert.json").exists(), "a refused certification still wrote an artifact"
          print("  synthetic candidate refused certification structurally; CI certifies nothing")
          PY

      - name: Operator permission-set policy and cache-classification tests
        id: policy_tests
        if: always()
        env:
          SIGNALNEST_ANCHOR_TIER: TIER_1_SYNTHETIC
          SIGNALNEST_CANDIDATE_MANIFEST: ${{ github.workspace }}/tests/fixtures/candidate-manifest.json
        run: |
          # GATE 4N-I28BH-E5. The strict Gate-4N bootstrap adjudicates the AMBIENT Docker
          # configuration surface (docker_boundary), and a GitHub-hosted runner ships
          # ~/.docker/config.json carrying registry 'auths' — which docker_boundary declares
          # FATAL_IF_PRESENT because embedded credentials change which registry a push/pull
          # authenticates to. This graded step CONSUMES no Docker (docker_boundary only READS
          # state; no graded script shells out to the docker CLI), so its correct execution
          # surface is a hermetic HOME — exactly as scripts/empty_home_ci.sh establishes for the
          # local reproduction. DOCKER_CONFIG is deliberately NOT used to point elsewhere: the
          # boundary declares DOCKER_CONFIG itself FATAL_IF_PRESENT steering. HOME is set ONLY on
          # this pytest command, so the later "Build the reader image" / "In-image verification"
          # steps keep the runner HOME and its CI-provisioned daemon. A clean config with 'auths'
          # would still be FATAL — this relocates the surface, it does not weaken the rule.
          SANDBOX_HOME="$(mktemp -d)"
          HOME="$SANDBOX_HOME" PYTHONPATH="$GITHUB_WORKSPACE/scripts" .reader-venv/bin/python -m pytest tests/ -q -p signalnest_bootstrap -p pytest_session_guard

      # GATE 4N-I26C, wiring the three controls Gate 4N-I26B built and left unexecuted. A
      # control that is not invoked by the workflow is not a control; I26B's own evidence
      # recorded that gap rather than hiding it, and this closes it.
      - name: CI environment dataflow (availability precedes consumption)
        id: env_dataflow
        if: always()
        run: python3 scripts/ci_env_dataflow.py

      - name: Structural failure propagation (does failure fail the job?)
        id: failure_propagation
        if: always()
        run: python3 scripts/failure_propagation.py

      - name: True CI-equivalent harness (model-only in CI; the runner IS the execution)
        id: ci_harness
        if: always()
        run: python3 scripts/ci_harness.py --model-only

      # GATE 4N-I26C, closing the discovery half of I26B-01. As of Gate 4N-I28BH-B every
      # discovered SECURITY_CRITICAL collection carries an assurance ASSIGNMENT in
      # security-assurance-registry.json (SECURITY_UNGOVERNED == 0); inventory now demands that
      # assignment rather than a shortenable completeness_consumers entry, so an id can no longer go
      # green by leaving the old manifest. Both-directions meta on the registry is enforced too.
      - name: Security-critical list inventory and meta-completeness
        id: critical_lists
        if: always()
        run: python3 scripts/critical_list_inventory.py

      # GATE 4N-I26D. Both currently FAIL, reporting the real residual: 35 of 48
      # security-critical collections still have no completeness consumer, and not every
      # discovered site has executed behavioural proof. Wired anyway — I26B was faulted for
      # building controls and leaving them unexecuted, and a guard that reports the deficit is
      # worth more red than a green pipeline that never measured it.
      - name: Security-critical collection completeness
        id: collection_completeness
        if: always()
        run: python3 scripts/collection_completeness.py

      # GATE 4N-I28BH-B. The SIBLING assurance validator: it RUNS the property-specific control for
      # every SECURITY collection whose property collection_completeness cannot express — reviewed
      # integrity (authored vocabularies), exclusion-policy (reviewed carve-outs / independent
      # ceilings), cross-domain consistency, generated-contract equality, and runtime invariants —
      # via a CLOSED {assurance_kind: handler} dispatch that fails closed on an unknown kind or a
      # missing/invalid config. Membership/partition rows are confirmed wired to their existing
      # certificate-backed consumer. All 176 assignments must ACCEPT.
      - name: Security-collection assurance (property-specific, fail-closed)
        id: security_collection_assurance
        if: always()
        run: python3 scripts/security_collection_assurance.py

      - name: Gate 4N guard results
        if: always()
        run: |
          fail=0
          for r in "toolchain_pre=${{ steps.toolchain_pre.outcome }}" \
                   "module_tests=${{ steps.module_tests.outcome }}" \
                   "window_tests_alb=${{ steps.window_tests_alb.outcome }}" \
                   "window_tests_data_cache=${{ steps.window_tests_data_cache.outcome }}" \
                   "window_tests_network=${{ steps.window_tests_network.outcome }}" \
                   "window_negative_control=${{ steps.window_negative_control.outcome }}" \
                   "root_boundary_tests=${{ steps.root_boundary_tests.outcome }}" \
                   "iam_module_tests=${{ steps.iam_module_tests.outcome }}" \
                   "toolchain_post=${{ steps.toolchain_post.outcome }}" \
                   "root_wiring=${{ steps.root_wiring.outcome }}" \
                   "boundaries=${{ steps.boundaries.outcome }}" \
                   "closure=${{ steps.closure.outcome }}" \
                   "anchor_tier=${{ steps.anchor_tier.outcome }}" \
                   "anchor=${{ steps.anchor.outcome }}" \
                   "deny_requirements=${{ steps.deny_requirements.outcome }}" \
                   "deny_probes=${{ steps.deny_probes.outcome }}" \
                   "lifecycle=${{ steps.lifecycle.outcome }}" \
                   "provenance=${{ steps.provenance.outcome }}" \
                   "exhaustion=${{ steps.exhaustion.outcome }}" \
                   "arn_model=${{ steps.arn_model.outcome }}" \
                   "policy_validation=${{ steps.policy_validation.outcome }}" \
                   "triangulation=${{ steps.triangulation.outcome }}" \
                   "expressions=${{ steps.expressions.outcome }}" \
                   "trust=${{ steps.trust.outcome }}" \
                   "oracle=${{ steps.oracle.outcome }}" \
                   "allow_axis=${{ steps.allow_axis.outcome }}" \
                   "rollout=${{ steps.rollout.outcome }}" \
                   "candidate_discovery=${{ steps.candidate_discovery.outcome }}" \
                   "putrolepolicy=${{ steps.putrolepolicy.outcome }}" \
                   "verifier_policy=${{ steps.verifier_policy.outcome }}" \
                   "verifier_ceiling=${{ steps.verifier_ceiling.outcome }}" \
                   "role_inventory=${{ steps.role_inventory.outcome }}" \
                   "containment=${{ steps.containment.outcome }}" \
                   "ci_invocation=${{ steps.ci_invocation.outcome }}" \
                   "site_coverage=${{ steps.site_coverage.outcome }}" \
                   "gate_dependencies=${{ steps.gate_dependencies.outcome }}" \
                   "env_dataflow=${{ steps.env_dataflow.outcome }}" \
                   "failure_propagation=${{ steps.failure_propagation.outcome }}" \
                   "ci_harness=${{ steps.ci_harness.outcome }}" \
                   "critical_lists=${{ steps.critical_lists.outcome }}" \
                   "collection_completeness=${{ steps.collection_completeness.outcome }}" \
                   "security_collection_assurance=${{ steps.security_collection_assurance.outcome }}" \
                   "mutation_discovery=${{ steps.mutation_discovery.outcome }}" \
                   "evidence_binding=${{ steps.evidence_binding.outcome }}" \
                   "package_requirements=${{ steps.package_requirements.outcome }}" \
                   "package_coherence=${{ steps.package_coherence.outcome }}" \
                   "provenance_coverage=${{ steps.provenance_coverage.outcome }}" \
                   "tracked_state=${{ steps.tracked_state.outcome }}" \
                   "certification=${{ steps.certification.outcome }}" \
                   "certification_gate=${{ steps.certification_gate.outcome }}" \
                   "policy_tests=${{ steps.policy_tests.outcome }}"; do
            echo "  $r"
            case "$r" in *=success) ;; *) fail=1 ;; esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more Gate 4N guards did not succeed." >&2
            exit 1
          fi

      - name: Build the reader image
        uses: docker/build-push-action@v6
        with:
          context: apps/revision-reader
          file: apps/revision-reader/Dockerfile
          target: reader
          platforms: linux/amd64
          tags: signalnest-revision-reader:ci
          load: true
          # SYNTHETIC destination pins for CI only — never a real endpoint. They must be
          # non-empty (the Dockerfile fails the build otherwise) and a plausible RDS-style
          # host so the reader's host validation admits them; the in-image band then proves
          # the reader connects only to THIS baked host and rejects any other.
          build-args: |
            EXPECTED_DB_HOST=test-db.abc123.us-east-1.rds.amazonaws.com
            EXPECTED_DB_NAME=signalnest
            EXPECTED_DB_USER=signalnest_app

      - name: In-image verification band
        run: |
          image="signalnest-revision-reader:ci"

          echo "== (1) the image runs and psycopg imports (catches a builder/base ABI mismatch) =="
          docker run --rm --network none --entrypoint /usr/bin/python3.13 "$image" \
            -c "import psycopg; print('psycopg import ok')"

          echo "== (2) the image CANNOT migrate: Alembic and the application are absent =="
          for mod in alembic sqlalchemy app app.db.migrate pydantic boto3 fastapi; do
            if docker run --rm --network none --entrypoint /usr/bin/python3.13 "$image" -c "import ${mod}" 2>/dev/null; then
              echo "::error::FORBIDDEN MODULE PRESENT: ${mod} imports inside the reader image." >&2
              exit 1
            fi
          done

          echo "== (3) no shell interpreter is present (defence in depth) =="
          for sh in /bin/sh /bin/bash /usr/bin/sh /bin/busybox; do
            if docker run --rm --network none --entrypoint "$sh" "$image" -c "id" 2>/dev/null; then
              echo "::error::A shell is present at ${sh}." >&2
              exit 1
            fi
          done

          echo "== (4) fixed exec-form entrypoint, empty CMD, non-root uid =="
          entry="$(docker inspect --format '{{ json .Config.Entrypoint }}' "$image")"
          test "$entry" = '["/usr/bin/python3.13","-m","revision_reader.reader"]'
          cmd="$(docker inspect --format '{{ json .Config.Cmd }}' "$image")"
          case "$cmd" in 'null'|'[]') : ;; *) echo "::error::CMD is ${cmd}, expected empty." >&2; exit 1 ;; esac
          test "$(docker inspect --format '{{ .Config.User }}' "$image")" = "10001:10001"

          echo "== (5) an override command becomes argv and is REJECTED (exit 50) =="
          # This is the control itself: ECS ContainerOverride carries `command` but not
          # `entryPoint`, so an override lands as argv to a program that refuses all argv.
          # `-c` is probed deliberately — `-m <module>` ends CPython option parsing, so it
          # arrives as argv rather than as a flag that would execute arbitrary code.
          for probe in "--help" "-c|import os; os.system('id')" "-m|app.db.migrate" "upgrade" "downgrade|base"; do
            IFS='|' read -r -a argv <<< "$probe"
            rc=0
            docker run --rm --network none -e DATABASE_URL='postgresql://u:p@h:5432/d?sslmode=require' \
              "$image" "${argv[@]}" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -ne 50 ]; then
              echo "::error::Override [${argv[*]}] exited ${rc}, expected 50 (argv rejected)." >&2
              exit 1
            fi
          done

          echo "== (6) destination is BAKED: any host but the baked one fails closed =="
          # Gate 4J.1. The host/db/role are baked (build args above); the reader connects to
          # the baked host regardless of the DSN and takes only the password from it. So
          # every redirect shape fails closed at CONFIG (51) — the DSN host is never dialled.
          BAKED_HOST=test-db.abc123.us-east-1.rds.amazonaws.com
          expect() {
            want="$1"; shift
            rc=0
            out="$(docker run --rm --network none "$@" "$image" 2>&1)" || rc=$?
            if [ "$rc" -ne "$want" ]; then
              echo "::error::Expected exit ${want}, got ${rc}. Output: ${out}" >&2
              exit 1
            fi
            if printf '%s' "$out" | grep -Eq 'Traceback|password|secret|@[a-z0-9.-]+:5432'; then
              echo "::error::Reader output disclosed a traceback or credential material." >&2
              exit 1
            fi
          }
          expect 51                                                             # no DSN at all
          # BLOCKING 1 (confirmed exploit): arbitrary DNS host / IP -> tamper detector, never dialled.
          expect 51 -e DATABASE_URL='postgresql://u:pw@attacker.example.com:5432/d?sslmode=require'
          expect 51 -e DATABASE_URL='postgresql://u:pw@203.0.113.9:5432/d?sslmode=require'
          # BLOCKING 2 (confirmed exploit): the exact bracketed-authority bypass.
          expect 51 -e DATABASE_URL='postgresql://u:pw@evil.invalid%2Cdb.invalid[v1.x]/d?sslmode=require'
          # BLOCKING 3 (new): a percent-encoded NUL in the password — invisible raw, a NUL
          # after unquote that would truncate libpq's conninfo. Gated on the DECODED value.
          expect 51 -e DATABASE_URL="postgresql+psycopg://signalnest_app:s3cr3t%00pw@${BAKED_HOST}:5432/signalnest?sslmode=require"
          # Wrong scheme, multi-host, and userinfo '@' ambiguity all fail closed.
          expect 51 -e DATABASE_URL="mysql://signalnest_app:pw@${BAKED_HOST}:5432/signalnest?sslmode=require"
          expect 51 -e DATABASE_URL="postgresql://signalnest_app:pw@evil.invalid,${BAKED_HOST}:5432/d?sslmode=require"
          expect 51 -e DATABASE_URL='postgresql://u:p@ss@evil.invalid:443/d?sslmode=require'
          # A DSN naming the BAKED host with a valid, decodable password reaches connect: the
          # discrete-param path (driver-suffix normalise + '%40' password decode) dials the
          # baked host, which will not answer under --network none -> CONNECT_FAILED (52).
          # This is the positive control that the reader actually connects, not just rejects.
          expect 52 -e DATABASE_URL="postgresql+psycopg://signalnest_app:s3cr3tpw@${BAKED_HOST}:5432/signalnest?sslmode=require"
          expect 52 -e DATABASE_URL="postgresql://signalnest_app:p%40ss@${BAKED_HOST}:5432/signalnest?sslmode=require"

          echo "== (7) baked pins and the CA bundle are present and non-empty =="
          docker run --rm --network none --entrypoint /usr/bin/python3.13 "$image" -c "
          import os
          from revision_reader import _pinned
          assert _pinned.EXPECTED_DB_HOST == '${BAKED_HOST}', _pinned.EXPECTED_DB_HOST
          assert _pinned.EXPECTED_DB_NAME and _pinned.EXPECTED_DB_USER
          assert os.path.isfile(_pinned.CA_BUNDLE_PATH), _pinned.CA_BUNDLE_PATH
          print('pins + CA present ok')"

          echo "== (8) the baked CA bundle is byte-identical to the reviewed, pinned asset =="
          got="$(docker run --rm --network none --entrypoint /usr/bin/python3.13 "$image" -c "
          import hashlib, pathlib
          print(hashlib.sha256(pathlib.Path('/etc/ssl/rds/rds-global-bundle.pem').read_bytes()).hexdigest())")"
          want="e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3"
          test "$got" = "$want" || { echo "::error::baked CA sha256 ${got} != ${want}" >&2; exit 1; }

          echo "== (9) exact interpreter patch version (logged, not asserted — drift visible) =="
          docker run --rm --network none --entrypoint /usr/bin/python3.13 "$image" \
            -c "import sys; print('reader interpreter:', sys.version)"

          echo "revision-reader in-image verification: PASS"

      # --- Merge-path security scanning of the reader image (P6-CI-6) --------------------
      # Same shape as the Container build and security job: Trivy writes the report and the
      # SBOM for the image built above, security/gate.py binds both to that image (same
      # ImageID) and evaluates them against security/policy.json. See security/README.md.
      - name: Create the security reports directory
        run: mkdir -p security-reports

      - name: Trivy — reader image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: signalnest-revision-reader:ci
          scanners: vuln
          format: json
          output: security-reports/trivy-image-reader-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — reader image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: signalnest-revision-reader:ci
          format: cyclonedx
          output: security-reports/sbom-image-reader.cdx.json
          exit-code: '0'
          trivy-config: security/trivy-scan.yaml

      - name: Gate — reader image vulnerabilities (OS packages and the pinned psycopg)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-image-reader-vuln.json --name image-reader-vuln
          --kind image --artifact signalnest-revision-reader:ci --min-lang-packages 1

      - name: Gate — reader image SBOM identity and population
        if: always()
        run: >-
          python3 security/gate.py sbom security-reports/sbom-image-reader.cdx.json --name sbom-image-reader
          --kind image --artifact signalnest-revision-reader:ci --min-components 10 --commit "${{ github.event.pull_request.head.sha || github.sha }}" --checkout "${{ github.sha }}"
          --image-id-from security-reports/trivy-image-reader-vuln.json
          --identity-out security-reports/sbom-image-reader.identity.json

      # P6-CI-6 closure: the reader job's installed tooling — the .reader-venv (hash-locked) and the job's
      # system interpreter (the locked pip, installed over its bundled one, and the Gate 4N PyYAML) — is scanned AS INSTALLED after every
      # step that installs into it, and every distribution their own pip inspect lists must be in the scan.
      # The inventories are taken again just before completeness, so a later install fails completeness.
      - name: Inventory the reader tooling environments as installed (pip inspect)
        if: always()
        run: |
          .reader-venv/bin/python -m pip inspect > security-reports/reader-tooling-venv-installed.json
          python3 -m pip inspect > security-reports/reader-tooling-syspy-installed.json

      # P6-CI-6 coverage gaps (operator order 2026-10-20): the packages the two environments' pips vendor (no dist-info)
      # are analysed from staged pin lists, and the Trivy and OpenTofu binaries on this job's PATH are analysed (Go binary
      # analysis) and bound to their pinned release digests (security/scanner-binaries.json).
      - name: Stage the packages the reader tooling environments' installers vendor, and the binaries on this job's PATH
        if: always()
        run: |
          python3 security/stage_inputs.py vendored --out .vendored-pins --env reader-venv .reader-venv security-reports/reader-tooling-venv-installed.json --env reader-syspy "${{ env.pythonLocation }}" security-reports/reader-tooling-syspy-installed.json
          python3 security/stage_inputs.py binaries --pins security/scanner-binaries.json --job revision-reader --out .scanner-binaries --manifest security-reports/scanner-binaries-manifest.json

      - name: Trivy — reader tooling venv vulnerabilities, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .reader-venv
          scanners: vuln
          format: json
          output: security-reports/trivy-reader-tooling-venv-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — reader job system interpreter packages, scanned as installed
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: ${{ env.pythonLocation }}
          scanners: vuln
          format: json
          output: security-reports/trivy-reader-tooling-syspy-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Trivy — packages vendored inside the installed environments (staged pin lists)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins
          scanners: vuln
          format: json
          output: security-reports/trivy-vendored-pins-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Trivy — the scanner and tool binaries on this job's PATH (Go binary analysis)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: .scanner-binaries
          scanners: vuln
          format: json
          output: security-reports/trivy-scanner-binaries-vuln.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Gate — reader tooling venv (every installed distribution scanned; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-reader-tooling-venv-vuln.json --name reader-tooling-venv
          --kind tooling --artifact .reader-venv --env-root .reader-venv --min-lang-packages 15
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target reader-venv/requirements-vendored-pip.txt
          --installed-inventory security-reports/reader-tooling-venv-installed.json

      - name: Gate — reader job system interpreter (every installed distribution scanned; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-reader-tooling-syspy-vuln.json --name reader-tooling-syspy
          --kind tooling --artifact "${{ env.pythonLocation }}" --env-root "${{ env.pythonLocation }}" --min-lang-packages 2
          --vendored-report security-reports/trivy-vendored-pins-vuln.json --vendored-artifact .vendored-pins --vendored-target reader-syspy/requirements-vendored-pip.txt
          --installed-inventory security-reports/reader-tooling-syspy-installed.json

      - name: Gate — the scanner and tool binaries on this job's PATH (pinned release digests, Go binary analysis present; CRITICAL fails)
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/trivy-scanner-binaries-vuln.json --name scanner-binaries
          --kind binary --artifact .scanner-binaries --binary-job revision-reader --binary-pins security/scanner-binaries.json
          --binary-manifest security-reports/scanner-binaries-manifest.json

      # Real-scanner negative control for the installed-environment (rootfs) scans (this job runs its own Trivy and DB): an inert dist-info
      # (metadata only, no code) of a known-vulnerable PyYAML, with its inventory, must be found by Trivy rootfs and fail
      # the tooling gate.
      - name: Negative control — Trivy scans an inert installed environment carrying a known CRITICAL (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/tooling-env
          scanners: vuln
          format: json
          output: security-reports/control-tooling-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — the tooling gate must fail on it
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-tooling-rootfs.json --name control-tooling-rootfs
          --kind tooling --artifact security/controls/tooling-env --env-root security/controls/tooling-env --min-lang-packages 1
          --installed-inventory security/controls/tooling-env-installed.json --expect-fail

      # Real-scanner negative control for the vendored-pin scan: an inert environment (metadata only, no code) whose pip
      # declares a known-vulnerable PyYAML in pip/_vendor/vendor.txt, and nowhere else, must be staged, found by the Trivy
      # filesystem scan and fail the tooling gate with a violation in its vendored-pin target.
      - name: Negative control — stage the vendored pins of an inert environment whose installer vendors a known CRITICAL
        if: always()
        run: python3 security/stage_inputs.py vendored --out .vendored-pins-control --env control security/controls/vendored-env security/controls/vendored-env-installed.json

      - name: Negative control — Trivy scans the inert environment (rootfs)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: rootfs
          scan-ref: security/controls/vendored-env
          scanners: vuln
          format: json
          output: security-reports/control-vendored-env-rootfs.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy-scan.yaml

      - name: Negative control — Trivy scans its staged vendored pins
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .vendored-pins-control
          scanners: vuln
          format: json
          output: security-reports/control-vendored-pins.json
          exit-code: '0'
          list-all-pkgs: true
          trivy-config: security/trivy.yaml

      - name: Negative control — the tooling gate must fail on the vendored copy
        if: always()
        run: >-
          python3 security/gate.py vuln security-reports/control-vendored-env-rootfs.json --name control-vendored-pins
          --kind tooling --artifact security/controls/vendored-env --env-root security/controls/vendored-env --min-lang-packages 1
          --vendored-report security-reports/control-vendored-pins.json --vendored-artifact .vendored-pins-control --vendored-target control/requirements-vendored-pip.txt
          --installed-inventory security/controls/vendored-env-installed.json --expect-fail
          --expect-violation target=control/requirements-vendored-pip.txt

      - name: Negative control — the adopted vulnerability policy over this run's reader image and tooling reports
        if: always()
        run: python3 security/vuln_policy_controls.py check reader security-reports

      - name: Inventory the reader tooling environments again, after every other step (a later install must fail)
        if: always()
        run: |
          .reader-venv/bin/python -m pip inspect > security-reports/reader-tooling-venv-installed-final.json
          python3 -m pip inspect > security-reports/reader-tooling-syspy-installed-final.json

      - name: Gate — reader tooling environments, final inventories against the same scans
        if: always()
        run: |
          python3 security/gate.py vuln security-reports/trivy-reader-tooling-venv-vuln.json --name reader-tooling-venv-final --kind tooling --artifact .reader-venv --env-root .reader-venv --min-lang-packages 15 --vendored-artifact .vendored-pins --vendored-target reader-venv/requirements-vendored-pip.txt --vendored-report security-reports/trivy-vendored-pins-vuln.json --installed-inventory security-reports/reader-tooling-venv-installed-final.json
          python3 security/gate.py vuln security-reports/trivy-reader-tooling-syspy-vuln.json --name reader-tooling-syspy-final --kind tooling --artifact "${{ env.pythonLocation }}" --env-root "${{ env.pythonLocation }}" --min-lang-packages 2 --vendored-artifact .vendored-pins --vendored-target reader-syspy/requirements-vendored-pip.txt --vendored-report security-reports/trivy-vendored-pins-vuln.json --installed-inventory security-reports/reader-tooling-syspy-installed-final.json

      - name: Every required reader security analysis ran and was gated (completeness)
        if: always()
        run: >-
          python3 security/gate.py complete --name complete
          --expect-pass image-reader-vuln --expect-pass sbom-image-reader
          --expect-pass reader-tooling-venv --expect-pass reader-tooling-syspy
          --expect-pass reader-tooling-venv-final --expect-pass reader-tooling-syspy-final --expect-pass scanner-binaries
          --expect-control control-vulnpol-baseline-reader-image
          --expect-control control-vulnpol-baseline-reader-tooling
          --expect-control control-vulnpol-critical-fix-reader-image
          --expect-control control-vulnpol-critical-nofix-reader-image
          --expect-control control-vulnpol-critical-fix-reader-tooling
          --expect-control control-vulnpol-critical-nofix-reader-tooling
          --expect-control control-vulnpol-high-fix-reader-tooling
          --expect-control control-vulnpol-high-nofix-reader-image
          --expect-control control-vulnpol-reader-tooling-package-not-scanned
          --expect-control control-vulnpol-reader-tooling-installed-after-scan
          --expect-control control-vulnpol-reader-tooling-version-differs
          --expect-control control-vulnpol-reader-tooling-inventory-of-another-environment
          --expect-control control-vulnpol-critical-nofix-reader-tooling-vendored
          --expect-control control-vulnpol-critical-nofix-reader-tooling-node-pkg
          --expect-control control-vulnpol-critical-wontfix-reader-image-os
          --expect-control control-vulnpol-baseline-reader-syspy --expect-control control-vulnpol-critical-nofix-reader-syspy
          --expect-control control-vulnpol-reader-syspy-package-not-scanned
          --expect-control control-tooling-rootfs --expect-control control-vendored-pins
          --expect-control control-vulnpol-critical-nofix-reader-tooling-vendored-pin
          --expect-control control-vulnpol-reader-tooling-vendored-pin-not-scanned
          --expect-control control-vulnpol-reader-tooling-truncated-inventory
          --expect-control control-vulnpol-reader-tooling-vendored-report-of-another-directory
          --expect-control control-vulnpol-critical-nofix-reader-syspy-vendored-pin
          --expect-control control-vulnpol-reader-syspy-vendored-pin-not-scanned
          --expect-control control-vulnpol-reader-syspy-truncated-inventory
          --expect-control control-vulnpol-reader-syspy-vendored-report-of-another-directory
          --expect-control control-vulnpol-reader-image-installer-present
          --expect-control control-vulnpol-reader-image-truncated-lang-packages
          --expect-control control-vulnpol-baseline-reader-binaries
          --expect-control control-vulnpol-critical-nofix-reader-binary-trivy
          --expect-control control-vulnpol-critical-nofix-reader-binary-tofu
          --expect-control control-vulnpol-high-fix-reader-binary-tofu
          --expect-control control-vulnpol-reader-binary-tofu-analysis-missing
          --expect-control control-vulnpol-reader-binary-trivy-stdlib-missing
          --expect-control control-vulnpol-reader-binary-tofu-manifest-digest-differs

      - name: Upload reader security report, SBOM and gate summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-revision-reader
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn
