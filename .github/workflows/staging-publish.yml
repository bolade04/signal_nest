name: Staging publish

# INFRA-5 (docs/phase-4b-c-infra-plan.md): the protected staging image build +
# publish workflow. INFRA-5 AUTHORS this file only — every run is a live
# execution and requires the separate INFRA-9 fresh authorization plus the
# protected `staging` GitHub environment's human approval. The workflow:
#
#   * builds the exact TWO authoritative images (aws-staging-iac-plan.md §26.5:
#     `api` and `worker`; the one-shot migration actor REUSES the worker digest
#     with a command override — a third image is prohibited),
#   * stamps the trusted checkout SHA into the OCI revision/version labels
#     (deployment-sha-wiring-plan.md §B; G4 evidence),
#   * re-runs the repository's container security gates plus a fail-closed
#     vulnerability scan,
#   * authenticates to AWS exclusively through GitHub OIDC (no long-lived AWS
#     key exists anywhere in this repository or its GitHub configuration),
#   * pushes commit-SHA-tagged images to the two private ECR repositories,
#     reads the REGISTRY-reported digests back, and
#   * uploads a non-secret digest manifest artifact (logical repository names
#     only — never an account id or private registry URI, wiring plan §G) for
#     the operator's git-ignored *.tfvars handoff consumed by INFRA-9.
#
# It never deploys: no ECS API call, no migration execution, no secret access,
# no task-definition or service mutation. Rollback of a bad publication is
# "do not consume the digest" — pushed images are inert until INFRA-9 pins
# them in tfvars.

on:
  # Manual dispatch ONLY. A push trigger would execute the publish on every
  # merge to main, violating the INFRA-5 stop boundary ("authoring only;
  # execution needs INFRA-9 authorization"). No pull_request trigger of any
  # kind: PR/fork code must never reach an OIDC-credentialed job.
  workflow_dispatch:

# One publication at a time; a publish mid-push is never cancelled (queued
# runs wait instead), so a half-pushed tag can't race a second run.
concurrency:
  group: staging-publish
  cancel-in-progress: false

# Least privilege: read-only at the workflow level. The single job below adds
# id-token: write for itself only.
permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # Locked by ADR-0001 for SIGNALNEST_STAGING; non-secret.
  AWS_REGION: us-east-1

jobs:
  build-publish:
    name: Build, verify, and publish the two staging images
    runs-on: ubuntu-latest
    # The protected `staging` environment enforces the plan-mandated human
    # approval gate and restricts runs to main. Its non-secret variables
    # supply the OIDC publisher-role ARN and account/registry targeting once
    # the INFRA-9 prerequisites exist; the guard step below fails closed while
    # they do not. NO AWS access key or secret exists in any secret store.
    environment: staging
    permissions:
      contents: read
      id-token: write # OIDC federation for this single job only
    steps:
      - name: Refuse to run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Staging publish runs only from refs/heads/main (got ${{ github.ref }})." >&2
          exit 1

      - name: Fail closed while the INFRA-9 prerequisites are absent
        env:
          ROLE_ARN: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          ACCOUNT_ID: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
        run: |
          if [ -z "${ROLE_ARN}" ] || [ -z "${ACCOUNT_ID}" ]; then
            echo "::error::The staging environment variables AWS_STAGING_PUBLISH_ROLE_ARN and/or AWS_STAGING_ACCOUNT_ID are not set." >&2
            echo "::error::They exist only after the INFRA-9-gated live prerequisites (remote-state bootstrap, composed-root apply creating the two ECR repositories, and the CI-OIDC publisher role) are provisioned under fresh authorization. Publishing before that is not possible and not authorized." >&2
            exit 1
          fi

      - name: Check out the exact trusted revision
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute build metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Fresh, cache-free builds: the publish path never consumes a layer cache
      # another (less trusted) workflow run may have written. Platform is
      # pinned to the ECS task-definition runtime (LINUX/X86_64, §26.2).
      - name: Build API image (linux/amd64, SHA-stamped)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: api
          platforms: linux/amd64
          tags: signalnest-api:${{ github.sha }}
          load: true
          no-cache: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}

      - name: Build worker image (linux/amd64, SHA-stamped)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: worker
          platforms: linux/amd64
          tags: signalnest-worker:${{ github.sha }}
          load: true
          no-cache: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}

      # Fail-closed zero-handoff bootstrap gate (Batch 4C.1B): the worker image
      # must carry app/db/bootstrap_app_role.py byte-identical to the trusted
      # checkout and import it with no settings, AWS, or database side effects.
      # Runs strictly BEFORE Trivy and before any AWS credential exists in this
      # job (OIDC/STS/ECR steps come later), against the locally built image
      # only. Fixed sanitized messages; no file contents, hashes only in
      # variables, no registry identifiers.
      - name: Verify bootstrap module inside the worker image (fail-closed)
        run: |
          set -euo pipefail
          image="signalnest-worker:${{ github.sha }}"
          cid="$(docker create "$image")"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            rm -f /tmp/bootstrap_in_image.py /tmp/verify_bootstrap_import.py
          }
          trap cleanup EXIT
          if ! docker cp "$cid:/app/app/db/bootstrap_app_role.py" /tmp/bootstrap_in_image.py 2>/dev/null; then
            echo "::error::bootstrap module missing from the worker image" >&2
            exit 1
          fi
          src_hash="$(sha256sum apps/api/app/db/bootstrap_app_role.py | awk '{print $1}')"
          img_hash="$(sha256sum /tmp/bootstrap_in_image.py | awk '{print $1}')"
          if [ "$src_hash" != "$img_hash" ]; then
            echo "::error::bootstrap module in the worker image is not byte-identical to the trusted checkout" >&2
            exit 1
          fi
          echo "ok: bootstrap module present and byte-identical to the trusted checkout"
          cat > /tmp/verify_bootstrap_import.py <<'PY'
          """Fail-closed import-safety probe for app.db.bootstrap_app_role.

          Fixed sanitized output only; exits nonzero on any violation.
          """
          import socket
          import sys


          class _Deny(Exception):
              pass


          def _deny(*_args, **_kwargs):
              raise _Deny()


          class _DenySocket(socket.socket):
              def __init__(self, *_args, **_kwargs):
                  raise _Deny()


          # Any socket creation or name resolution during import would mean an
          # AWS or database call: deny both so such an import fails loudly. A
          # subclass (not a bare function) keeps stdlib imports that reference
          # the socket class working while still refusing construction.
          socket.socket = _DenySocket  # type: ignore[misc]
          socket.create_connection = _deny  # type: ignore[assignment]
          socket.getaddrinfo = _deny  # type: ignore[assignment]

          try:
              import app.db.bootstrap_app_role as bootstrap
          except _Deny:
              print("bootstrap-import-check: FAIL network-activity-on-import")
              sys.exit(1)
          except BaseException:
              print("bootstrap-import-check: FAIL import-error")
              sys.exit(1)

          for name in ("app.core.config", "app.db.session", "app.db.migrate"):
              if name in sys.modules:
                  print("bootstrap-import-check: FAIL forbidden-module-imported")
                  sys.exit(1)

          if not callable(getattr(bootstrap, "main", None)):
              print("bootstrap-import-check: FAIL entrypoint-missing")
              sys.exit(1)

          try:
              import boto3  # noqa: F401
              import psycopg  # noqa: F401
          except BaseException:
              print("bootstrap-import-check: FAIL dependency-missing")
              sys.exit(1)

          print("bootstrap-import-check: PASS")
          PY
          docker run --rm --network none \
            -v /tmp/verify_bootstrap_import.py:/tmp/verify_bootstrap_import.py:ro \
            --entrypoint python "$image" /tmp/verify_bootstrap_import.py

      # Fail-closed hardened-migration gate (Batch 4F): the worker image must
      # carry app/db/migrate.py and app/core/config.py byte-identical to the
      # trusted checkout, and the migration entrypoint must behave as reviewed -
      # bare invocation upgrades then verifies the DB revision, fails closed on
      # every mismatch, initializes migration-mode with DATABASE_URL only, and
      # keeps ordinary staging startup strict. Runs strictly BEFORE Trivy and
      # before any AWS credential exists in this job, against the locally built
      # image only, over --network none. Fixed sanitized output; hashes only in
      # variables; no source, values, or exceptions in logs.
      - name: Verify hardened migration entrypoint inside the worker image (fail-closed)
        run: |
          set -euo pipefail
          image="signalnest-worker:${{ github.sha }}"
          cid="$(docker create "$image")"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            rm -f /tmp/mig_in_image.py /tmp/cfg_in_image.py /tmp/verify_migration.py
          }
          trap cleanup EXIT
          # Byte-integrity of the two migration-hardening source files.
          check_file() {
            in_path="$1"; tmp="$2"; src="$3"
            if ! docker cp "$cid:/app/$in_path" "$tmp" 2>/dev/null; then
              echo "::error::migration source $in_path missing from the worker image" >&2
              exit 1
            fi
            if [ "$(sha256sum "$src" | awk '{print $1}')" != "$(sha256sum "$tmp" | awk '{print $1}')" ]; then
              echo "::error::migration source $in_path not byte-identical to the trusted checkout" >&2
              exit 1
            fi
          }
          check_file "app/db/migrate.py" /tmp/mig_in_image.py apps/api/app/db/migrate.py
          check_file "app/core/config.py" /tmp/cfg_in_image.py apps/api/app/core/config.py
          echo "migration source integrity: PASS"
          cat > /tmp/verify_migration.py <<'PY'
          """Fail-closed in-image verification of the hardened migration entrypoint.

          Fixed sanitized output only; exits nonzero on any violation. No database
          connection, no AWS, no secret retrieval, no network.
          """
          import os
          import socket
          import sys
          from types import SimpleNamespace


          def _fail(token: str) -> None:
              print(f"hardened-migration-check: FAIL {token}")
              sys.exit(1)


          # Deny any socket use during import so a stray DB/AWS call fails loudly.
          class _DenySocket(socket.socket):
              def __init__(self, *_a, **_k):
                  raise _Deny()


          class _Deny(Exception):
              pass


          def _deny(*_a, **_k):
              raise _Deny()


          socket.socket = _DenySocket  # type: ignore[misc]
          socket.create_connection = _deny  # type: ignore[assignment]
          socket.getaddrinfo = _deny  # type: ignore[assignment]

          try:
              import app.db.migrate as m
          except _Deny:
              _fail("import-network-activity")
          except BaseException:
              _fail("import-error")

          # The upgrade path must not pull the app session engine (import-time DB).
          for forbidden in ("app.db.session",):
              if forbidden in sys.modules:
                  _fail("forbidden-module-imported")

          try:
              import alembic  # noqa: F401
              import psycopg  # noqa: F401
              import sqlalchemy  # noqa: F401
          except BaseException:
              _fail("dependency-missing")
          print("migration import safety: PASS")

          # Caller-controlled Alembic logging contract (Gate 4F): the shared
          # helper must return a Config with config_file_name cleared (so
          # env.py skips fileConfig and the application's structured logging
          # survives) while ini-derived options are preserved — both halves are
          # required, because clearing BEFORE the lazy ini parse silently loses
          # every ini option while migrations still appear to work.
          try:
              from app.db.schema import alembic_config as _real_alembic_config

              _cfg = _real_alembic_config()
              if _cfg.config_file_name is not None:
                  _fail("config-file-name-not-cleared")
              if _cfg.get_main_option("prepend_sys_path") != ".":
                  _fail("ini-options-lost")
          except _Deny:
              _fail("alembic-config-network")
          except SystemExit:
              raise
          except BaseException:
              _fail("alembic-config-error")
          print("alembic config ordering contract: PASS")

          # Bare-command contract via monkeypatch (no DB, no network).
          def _patch(code_head=None, upgrade_raises=False, db_rows=None, engine_raises=False):
              state = {"upgraded": None}
              m._single_code_head = lambda: code_head

              def _up(_cfg, target):
                  state["upgraded"] = target
                  if upgrade_raises:
                      raise RuntimeError("boom")

              m.command.upgrade = _up
              m.alembic_config = lambda: object()

              class _Conn:
                  def __enter__(self):
                      return self

                  def __exit__(self, *_a):
                      return None

                  def execute(self, _q):
                      if engine_raises:
                          raise RuntimeError("boom")

                      class _R:
                          def scalars(self_inner):
                              class _A:
                                  def all(self_a):
                                      return db_rows or []

                              return _A()

                      return _R()

              class _Eng:
                  def connect(self):
                      return _Conn()

                  def dispose(self):
                      return None

              m.create_engine = lambda *_a, **_k: _Eng()
              m.get_settings = lambda: SimpleNamespace(database_url="sqlite:////tmp/x")
              return state

          # Bare main([]) dispatches upgrade_and_verify exactly once.
          _seen = {"n": 0}
          _orig = m.upgrade_and_verify
          m.upgrade_and_verify = lambda: (_seen.__setitem__("n", _seen["n"] + 1) or 0)
          m.get_settings = lambda: SimpleNamespace(debug=False)
          if m.main([]) != 0 or _seen["n"] != 1:
              _fail("bare-dispatch")
          m.upgrade_and_verify = _orig

          # Silence the migrate module's own lifecycle logs so only fixed
          # classification lines reach the workflow log.
          import logging

          logging.disable(logging.CRITICAL)

          _patch(code_head=None)
          if m.upgrade_and_verify() != m.EXIT_CODE_HEADS:
              _fail("multi-code-head")
          _st = _patch(code_head="h", upgrade_raises=True)
          if m.upgrade_and_verify() != m.EXIT_UPGRADE_FAILED or _st["upgraded"] != "h":
              _fail("upgrade-blocks-verify")
          _patch(code_head="h", engine_raises=True)
          if m.upgrade_and_verify() != m.EXIT_READBACK_FAILED:
              _fail("readback")
          _patch(code_head="h", db_rows=["h", "h2"])
          if m.upgrade_and_verify() != m.EXIT_DB_HEADS:
              _fail("multi-db-head")
          _patch(code_head="h", db_rows=["other"])
          if m.upgrade_and_verify() != m.EXIT_REVISION_MISMATCH:
              _fail("mismatch")
          _st = _patch(code_head="h", db_rows=["h"])
          if m.upgrade_and_verify() != m.EXIT_OK or _st["upgraded"] != "h":
              _fail("exact-match")
          print("migration bare-command contract: PASS")

          # Migration-mode staging: initializes with DATABASE_URL only.
          from app.core.config import Settings

          for _k in ("SECRET_KEY", "REDIS_URL", "LLM_API_KEY", "DATABASE_URL"):
              os.environ.pop(_k, None)
          _pg = "postgresql+psycopg://u:p@synthetic.invalid:5432/db?sslmode=require"
          try:
              _s = Settings(
                  _env_file=None,
                  environment="staging",
                  migration_mode=True,
                  database_url=_pg,
              )
              if not (_s.migration_mode and _s.environment == "staging"):
                  _fail("migration-mode-shape")
          except _Deny:
              _fail("migration-mode-network")
          except BaseException:
              _fail("migration-mode-init")
          # No development fallback.
          try:
              Settings(_env_file=None, environment="development", migration_mode=True, database_url=_pg)
              _fail("migration-mode-dev-fallback")
          except SystemExit:
              raise
          except BaseException:
              pass
          print("migration-mode staging contract: PASS")

          # Ordinary staging strictness: no migration mode + only DATABASE_URL fails closed.
          try:
              Settings(_env_file=None, environment="staging", app_mode="full", database_url=_pg)
              _fail("ordinary-staging-not-strict")
          except SystemExit:
              raise
          except BaseException:
              pass
          print("ordinary staging strictness: PASS")

          print("hardened-migration-check: PASS")
          PY
          docker run --rm --network none \
            -v /tmp/verify_migration.py:/tmp/verify_migration.py:ro \
            --entrypoint python "$image" /tmp/verify_migration.py

      - name: Security check — non-root, no secrets (API)
        run: bash scripts/docker-security-check.sh "signalnest-api:${{ github.sha }}"

      - name: Security check — non-root, no secrets (worker)
        run: bash scripts/docker-security-check.sh "signalnest-worker:${{ github.sha }}"

      - name: API image imports cleanly
        run: docker run --rm --entrypoint python "signalnest-api:${{ github.sha }}" -c "import app.main; print('api import ok')"

      - name: Migration actor + schema gate run in the worker image
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/publish-ci.db --entrypoint sh "signalnest-worker:${{ github.sha }}" -c '
            python -m app.db.migrate upgrade &&
            python -m app.db.migrate check
          '

      - name: Bare migration actor command (exact ECS shape) in the worker image
        # ECS runs command = ["python","-m","app.db.migrate"] with NO subcommand
        # (infra/aws/modules/ecs/main.tf) — a different dispatch (upgrade +
        # read-back verification) from the explicit subcommands above. Execute
        # the real bare command against controlled SQLite, assert the positive
        # verification event with its independently sourced provenance fields,
        # and assert no secret-bearing output. (The full failure-band matrix is
        # PR-gated in ci.yml; this is the publish-time fail-closed replay.)
        run: |
          docker run --rm --network none -e LOG_FORMAT=json --entrypoint sh "signalnest-worker:${{ github.sha }}" -c '
            set -eu
            export DATABASE_URL=sqlite:////tmp/bare-publish.db
            python -m app.db.migrate > /tmp/bare_out.json 2> /tmp/bare_err.log
            grep -q "\"event\": \"migrate.upgrade_verify.done\"" /tmp/bare_out.json
            grep -q "\"code_head\"" /tmp/bare_out.json
            grep -q "\"db_revision\"" /tmp/bare_out.json
            test ! -s /tmp/bare_err.log
            ! grep -q "Traceback" /tmp/bare_out.json
            ! grep -q "sqlite:" /tmp/bare_out.json
            python -m app.db.revision_status | python -m app.db.revision_compare
            # Provenance: at a NON-head revision the pipe must MISMATCH (43) — a
            # reader printing the code head would make the line above tautological.
            python -c "import sqlite3; c=sqlite3.connect(\"/tmp/bare-publish.db\"); c.execute(\"DELETE FROM alembic_version\"); c.execute(\"INSERT INTO alembic_version VALUES (\x27aaaaaaaaaaaa\x27)\"); c.commit()"
            rc=0; python -m app.db.revision_status | python -m app.db.revision_compare >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 43
            echo "bare-command publish verification: PASS"
          '

      - name: Verify OCI revision labels match the trusted checkout
        run: |
          for image in "signalnest-api:${{ github.sha }}" "signalnest-worker:${{ github.sha }}"; do
            rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            if [ "$rev" != "${{ github.sha }}" ]; then
              echo "::error::$image carries OCI revision '$rev', expected '${{ github.sha }}'." >&2
              exit 1
            fi
            arch="$(docker inspect --format '{{ .Os }}/{{ .Architecture }}' "$image")"
            if [ "$arch" != "linux/amd64" ]; then
              echo "::error::$image platform is '$arch', expected linux/amd64 (ECS §26.2)." >&2
              exit 1
            fi
          done
          echo "ok: both images stamped with the trusted revision on linux/amd64"

      # Fail-closed vulnerability gate. The authoritative plans require "scan
      # completion + fail-closed acceptance per image" (registry README §9)
      # without fixing a threshold; INFRA-5 sets it to CRITICAL+HIGH (subject
      # to review). ECR scan-on-push additionally re-scans after the push.
      - name: Vulnerability scan (API) — fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signalnest-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Vulnerability scan (worker) — fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signalnest-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ------------------------------------------------------------------
      # Everything below holds short-lived OIDC-derived credentials.
      # ------------------------------------------------------------------
      - name: Authenticate to AWS via GitHub OIDC (no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: signalnest-staging-publish-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Verify the assumed identity is the intended staging account
        env:
          ACCOUNT_ID: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
        run: |
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual" != "${ACCOUNT_ID}" ]; then
            echo "::error::Assumed-role account does not match the configured staging account. Refusing to publish." >&2
            exit 1
          fi
          echo "ok: caller identity matches the configured staging account (id not printed)"

      - name: Log in to the staging ECR registry
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # mask-password above masks only the ECR auth token. The registry
      # hostname embeds the AWS account id, which this public repository's
      # logs must never disclose (wiring-plan §G) — and `docker push` prints
      # the repository host in its normal output. Registering the host as a
      # mask redacts EVERY subsequent occurrence structurally, no matter
      # which future command prints it.
      - name: Mask the account-bearing registry host in all subsequent logs
        run: echo "::add-mask::${{ steps.ecr-login.outputs.registry }}"

      - name: Push both images by immutable commit tag and read back digests
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          NAME_PREFIX: ${{ vars.AWS_STAGING_NAME_PREFIX || 'signalnest-staging' }}
        run: |
          mkdir -p publish-evidence
          for target in api worker; do
            repo="${NAME_PREFIX}/${target}"
            uri="${REGISTRY}/${repo}:${{ github.sha }}"
            docker tag "signalnest-${target}:${{ github.sha }}" "$uri"
            docker push "$uri"
            digest="$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageTag="${{ github.sha }}" \
              --query 'imageDetails[0].imageDigest' --output text)"
            case "$digest" in
              sha256:*) : ;;
              *) echo "::error::ECR returned no digest for ${repo}:${{ github.sha }}" >&2; exit 1 ;;
            esac
            # Advisory confirmation only: the ECR describe-images digest above
            # is authoritative. If docker exposes no local RepoDigest the
            # check is skipped — it can corroborate but never substitute.
            local_digest="$(docker inspect --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' "$uri" | grep -F "@" | head -1 | cut -d@ -f2 || true)"
            if [ -n "$local_digest" ] && [ "$local_digest" != "$digest" ]; then
              echo "::error::Local push digest ($local_digest) and registry digest ($digest) disagree for ${repo}." >&2
              exit 1
            fi
            echo "${target} ${digest}" >> publish-evidence/digests.txt
            echo "ok: ${target} pushed; registry digest recorded (account-bearing registry host masked in logs)"
          done

      # Non-secret digest manifest (wiring plan §G): logical repository names
      # and digests only — never an account id or private registry URI. The
      # operator composes the full repository@digest URIs privately into the
      # git-ignored *.tfvars for INFRA-9.
      - name: Write digest manifest
        run: |
          api_digest="$(awk '$1=="api"{print $2}' publish-evidence/digests.txt)"
          worker_digest="$(awk '$1=="worker"{print $2}' publish-evidence/digests.txt)"
          cat > publish-evidence/digest-manifest.json <<EOF
          {
            "source_commit": "${{ github.sha }}",
            "platform": "linux/amd64",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "images": [
              { "logical_repository": "api",    "image_tag": "${{ github.sha }}", "registry_digest": "${api_digest}" },
              { "logical_repository": "worker", "image_tag": "${{ github.sha }}", "registry_digest": "${worker_digest}" }
            ],
            "consumers": {
              "api_image_digest": "${api_digest}",
              "worker_image_digest": "${worker_digest}",
              "note": "Supply these via the git-ignored *.tfvars at INFRA-9; the migration task reuses worker_image_digest (§26.5)."
            }
          }
          EOF
          cat publish-evidence/digest-manifest.json

      - name: Upload digest manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: staging-digest-manifest-${{ github.sha }}
          path: publish-evidence/digest-manifest.json
          retention-days: 90
